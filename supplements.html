// ---- HELPERS ----
function today() { return new Date().toLocaleDateString('de-DE'); }

function parseDE(s) {
  if (!s) return null;
  const p = String(s).split('.');
  if (p.length !== 3) return null;
  const d = new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]));
  return isNaN(d.getTime()) ? null : d;
}

function daysBetween(a, b) {
  const da = parseDE(a), db = parseDE(b);
  if (!da || !db) return 0;
  return Math.round(Math.abs(db - da) / 86400000);
}

function parseMinSek(val) {
  if (!val && val !== 0) return 0;
  const s = String(val).trim();
  // Support both "6:28" and "6.28" as min:sek
  const sep = s.includes(':') ? ':' : s.includes('.') ? '.' : null;
  if (sep) {
    const parts = s.split(sep);
    const m = parseInt(parts[0]||0, 10);
    const sec = parseInt(parts[1]||0, 10);
    // Sanity check: seconds should be 0-59
    if (sec >= 0 && sec <= 59) return m + sec/60;
    // If seconds > 59, treat as pure decimal minutes
    return parseFloat(s) || 0;
  }
  return parseFloat(s) || 0;
}

function formatMinSek(decMin) {
  const m = Math.floor(decMin);
  const s = Math.round((decMin - m) * 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

function addEv(type, msg) {
  if (!state.events) state.events = [];
  state.events.push({type, date:today(), msg});
  if (state.events.length > 300) state.events = state.events.slice(-300);
}

}

function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e) {}
}

['supplements','suppStreaks','mastery','masteryLevel','questState'].forEach(k => {

});

if (!state.events) state.events = [];

// ---- KSM / BKOMP CYCLE STATE ----
function getKsmState() {
  const ksm = state.ksm;
  if (!ksm || !ksm.cycleStart) return {phase:'idle', dayInPhase:0, totalDays:KSM_ON, pct:0};
  const daysSince = Math.floor((new Date() - new Date(ksm.cycleStart)) / 86400000);
  const cycle = KSM_ON + KSM_OFF;
  const dayInCycle = daysSince % cycle;
  if (dayInCycle < KSM_ON) return {phase:'on', dayInPhase:dayInCycle+1, totalDays:KSM_ON, canTake:true, pct:((dayInCycle+1)/KSM_ON)*100};
  const offDay = dayInCycle - KSM_ON + 1;
  return {phase:'off', dayInPhase:offDay, totalDays:KSM_OFF, canTake:false, pct:(offDay/KSM_OFF)*100};
}

function getBkompState() {
  const startStr = localStorage.getItem('panzer_bkur_start');
  if (!startStr) return {phase:'idle', dayInPhase:0, totalDays:BKOMP_ON, pct:0};
  const daysSince = Math.floor((new Date() - new Date(startStr)) / 86400000);
  const cycle = BKOMP_ON + BKOMP_OFF;
  const dayInCycle = daysSince % cycle;
  if (dayInCycle < BKOMP_ON) return {phase:'on', dayInPhase:dayInCycle+1, totalDays:BKOMP_ON, canTake:true, pct:((dayInCycle+1)/BKOMP_ON)*100};
  const offDay = dayInCycle - BKOMP_ON + 1;
  return {phase:'off', dayInPhase:offDay, totalDays:BKOMP_OFF, canTake:false, pct:(offDay/BKOMP_OFF)*100};
}

// ---- STREAK (nur KERN_SUPPS) ----
function calcSuppStreak(id) {
  const dates = Object.keys(state.supplements).sort((a,b) => {
    const da = parseDE(a), db = parseDE(b);
    if (!da || !db) return 0;
    return db - da;
  });
  let streak = 0;
  for (const d of dates) {
    if (state.supplements[d] && state.supplements[d][id]) streak++;
    else break;
  }
  return streak;
}

function recalcAllStreaks() {
  // Only KERN_SUPPS count for streaks
  KERN_SUPPS.forEach(s => { state.suppStreaks[s.id] = calcSuppStreak(s.id); });
}

// ---- STAT CALCULATION ----
function calcStats(st) {
  const s = {...st.stats};

  // STRENGTH — Score / Fettmasse (belohnt Kraft UND Körperkomposition)
  const egymS = (st.trainings||[]).filter(t => t.type==='egym');
  if (egymS.length === 0) { s.S = 1; } else if (egymS.length > 0) {
    const lastCI = (st.checkins && st.checkins.length) ? st.checkins.findLast(c=>c&&c.weight&&c.fat) : null;
    const bw = lastCI ? parseFloat(lastCI.weight) : 107.4;
    const kfa = lastCI ? parseFloat(lastCI.fat) : 27.9;
    const fettmasse = bw * (kfa/100);
    const best = Math.max(...egymS.map(t => t.score||0));
    const ratio = fettmasse > 0 ? best / fettmasse : 0;
    if      (ratio>=1800) s.S=10; else if (ratio>=1500) s.S=9;
    else if (ratio>=1250) s.S=8;  else if (ratio>=1000) s.S=7;
    else if (ratio>=800)  s.S=6;  else if (ratio>=650)  s.S=5;
    else if (ratio>=500)  s.S=4;  else if (ratio>=350)  s.S=3;
    else if (ratio>=200)  s.S=2;  else s.S=1;
  }

  // PERCEPTION
  const sleepCI = (st.checkins||[]).filter(c => c.sleepScore && parseFloat(c.sleepScore)>0);
  if (sleepCI.length > 0) {
    const recent = sleepCI.slice(-7);
    const avg = recent.reduce((sum,c) => sum+parseFloat(c.sleepScore),0) / recent.length;
    if      (avg>=90) s.P=10; else if (avg>=82) s.P=9;
    else if (avg>=75) s.P=8;  else if (avg>=68) s.P=7;
    else if (avg>=62) s.P=6;  else if (avg>=56) s.P=5;
    else if (avg>=50) s.P=4;  else if (avg>=42) s.P=3;
    else if (avg>=32) s.P=2;  else s.P=1;
  }

  // ENDURANCE
  const endS = (st.trainings||[]).filter(t => ['seil','bike','ergo'].includes(t.type));
  if (endS.length === 0) { s.E = 1; } else if (endS.length > 0) {
    const best = Math.max(...endS.map(t => {
      if (t.type==='seil') return parseFloat(t.dauer||0)*(parseFloat(t.rpm||0)/100);
      if (t.type==='bike'||t.type==='ergo') return parseFloat(t.distanz||0)*(parseFloat(t.avgSpeed||0)/10);
      return 0;
    }));
    if      (best>=50) s.E=10; else if (best>=38) s.E=9;
    else if (best>=28) s.E=8;  else if (best>=20) s.E=7;
    else if (best>=14) s.E=6;  else if (best>=9)  s.E=5;
    else if (best>=5)  s.E=4;  else if (best>=2)  s.E=3;
    else if (best>=0.5)s.E=2;  else s.E=1;
  }

  // CHARISMA — avg of KERN_SUPPS streaks only (7 supps)
  const streaks = KERN_SUPPS.map(sup => st.suppStreaks[sup.id]||0);
  const avg = streaks.reduce((a,b)=>a+b,0) / streaks.length;
  if      (avg>=90) s.C=10; else if (avg>=60) s.C=9;
  else if (avg>=45) s.C=8;  else if (avg>=30) s.C=7;
  else if (avg>=21) s.C=6;  else if (avg>=14) s.C=5;
  else if (avg>=7)  s.C=4;  else if (avg>=3)  s.C=3;
  else if (avg>=1)  s.C=2;  else s.C=1;

  // INTELLIGENCE — visceral fat inverted
  const vfEntry = (st.checkins&&st.checkins.length) ? st.checkins.findLast(c=>c&&c.visceral&&parseFloat(c.visceral)>0) : null;
  const latestVF = vfEntry ? parseFloat(vfEntry.visceral) : NaN;
  if (!isNaN(latestVF)) {
    if      (latestVF<=3)  s.I=10; else if (latestVF<=4)  s.I=9;
    else if (latestVF<=5)  s.I=8;  else if (latestVF<=6)  s.I=7;
    else if (latestVF<=8)  s.I=6;  else if (latestVF<=10) s.I=5;
    else if (latestVF<=12) s.I=4;  else if (latestVF<=14) s.I=3;
    else if (latestVF<=17) s.I=2;  else s.I=1;
  }

  // AGILITY — WHR + KFA
  let lWHR=null, lKFA=null;
  for (let i=(st.checkins||[]).length-1; i>=0; i--) {
    const c = st.checkins[i];
    if (!lWHR && c.taille && c.huefte && parseFloat(c.taille)>0)
      lWHR = parseFloat(c.taille)/parseFloat(c.huefte);
    if (!lKFA && c.fat && parseFloat(c.fat)>0)
      lKFA = parseFloat(c.fat);
    if (lWHR && lKFA) break;
  }
  if (lWHR !== null || lKFA !== null) {
    let ws=5, ks=5;
    if (lWHR!==null) {
      if      (lWHR<=0.75) ws=10; else if (lWHR<=0.80) ws=9;
      else if (lWHR<=0.84) ws=8;  else if (lWHR<=0.87) ws=7;
      else if (lWHR<=0.90) ws=6;  else if (lWHR<=0.93) ws=5;
      else if (lWHR<=0.95) ws=4;  else if (lWHR<=0.97) ws=3;
      else if (lWHR<=1.00) ws=2;  else ws=1;
    }
    if (lKFA!==null) {
      if      (lKFA<=10) ks=10; else if (lKFA<=13) ks=9;
      else if (lKFA<=16) ks=8;  else if (lKFA<=19) ks=7;
      else if (lKFA<=22) ks=6;  else if (lKFA<=25) ks=5;
      else if (lKFA<=28) ks=4;  else if (lKFA<=32) ks=3;
      else if (lKFA<=37) ks=2;  else ks=1;
    }
    s.A = Math.max(1, Math.min(10, Math.round((ws+ks)/2)));
  }

  // LAUFEN — Summe Schritte letzte 7 Tage
  const schritte7 = (st.checkins||[])
    .filter(c => c && c.schritte && parseInt(c.schritte,10) > 0)
    .slice(-7)
    .reduce((sum,c) => sum + parseInt(c.schritte,10), 0);
  if (schritte7 > 0) {
    if      (schritte7>=40000) s.L=10; else if (schritte7>=35000) s.L=9;
    else if (schritte7>=30000) s.L=8;  else if (schritte7>=25000) s.L=7;
    else if (schritte7>=20000) s.L=6;  else if (schritte7>=16000) s.L=5;
    else if (schritte7>=12000) s.L=4;  else if (schritte7>=8000)  s.L=3;
    else if (schritte7>=4000)  s.L=2;  else s.L=1;
  }

  return s;
}

function recalcStats() {
  const newStats = calcStats(state);
  KEYS.forEach(k => {
    const old=state.stats[k], nv=newStats[k];
    if (nv!==old) addEv(nv>old?'level_up':'level_down', `${k} → ${nv} ${nv>old?'▲':'▼'} (objektiv)`);
    state.stats[k] = nv;
  });
  saveState();
}

// ---- XP ENGINE ----
function xpForLevel(n) { return Math.round(500 * Math.pow(n, 1.25)); }

function getLvlInfo(totalXP) {
  let xp = totalXP||0, level = 1;
  while (xp >= xpForLevel(level)) { xp -= xpForLevel(level); level++; }
  return {level, currentXP:Math.round(xp), neededXP:xpForLevel(level)};
}

function statXpThresh(statLevel) { return Math.round(200 * Math.pow(statLevel, 1.25)); }

function calcEgymXP(sets, bodyWeight, modeFactor) {
  let total = 0;
  const statXP = {};
  const bw = parseFloat(bodyWeight)||107.4;
  for (const set of sets) {
    const kg=parseFloat(set.kg)||0, wdh=parseFloat(set.wdh)||0;
    const xp = (kg/bw)*wdh*(parseFloat(modeFactor)||1.0)*VET;
    total += xp;
    statXP[set.stat] = (statXP[set.stat]||0) + xp;
  }
  return {total:Math.round(total*10)/10, statXP};
}

function calcEgymScore(exData) {
  let score = 0;
  for (const ex of EGYM_EX) {
    const sets = (exData||{})[ex.id]||[];
    for (const set of sets) score += (parseFloat(set.kg)||0)*(parseFloat(set.wdh)||0);
  }
  return Math.round(score);
}

function calcSeilXP(dauer, rpm) {
  const base = parseFloat(dauer||0)*(parseFloat(rpm||0)/100)*5;
  const boosted = base*VET;
  return {total:Math.round(boosted*10)/10, statXP:{E:Math.round(boosted*0.6*10)/10, A:Math.round(boosted*0.4*10)/10}};
}

function calcBikeXP(distanz, avgSpeed, dauer) {
  // Zeitbasiert: Minuten × Intensität (avgSpeed/10)
  const base = parseFloat(dauer||0)*(parseFloat(avgSpeed||0)/10);
  const boosted = base*VET;
  return {total:Math.round(boosted*10)/10, statXP:{E:Math.round(boosted*0.6*10)/10, A:Math.round(boosted*0.4*10)/10}};
}

function calcErgoXP(distanz, avgSpeed, dauer) {
  // Zeitbasiert: Minuten × Intensität
  const base = parseFloat(dauer||0)*(parseFloat(avgSpeed||0)/10)||parseFloat(dauer||0)*0.8;
  const boosted = base*VET;
  return {total:Math.round(boosted*10)/10, statXP:{E:Math.round(boosted*0.7*10)/10, A:Math.round(boosted*0.3*10)/10}};
}

function calcSleepXP(sleepScore) {
  return Math.round(parseFloat(sleepScore||0)*0.1*VET*10)/10;
}

function applyXP(xpResult) {
  state.globalXP = (state.globalXP||0) + xpResult.total;
  if (!state.statTrainXP) state.statTrainXP = {S:0,P:0,E:0,C:0,I:0,A:0,L:0};
  Object.entries(xpResult.statXP||{}).forEach(([k,xp]) => {
    if (!xp) return;
    if ((state.stats[k]||1) >= 10) {
      if (!state.mastery) state.mastery = {};
      state.mastery[k] = (state.mastery[k]||0) + xp;
      const ml = Math.floor((state.mastery[k]||0)/500);
      if (!state.masteryLevel) state.masteryLevel = {};
      if (ml > (state.masteryLevel[k]||0)) {
        state.masteryLevel[k] = ml;
        addEv('mastery', `${k} MASTERY +${ml} OVERCHARGE`);
      }
    } else {
      state.statTrainXP[k] = (state.statTrainXP[k]||0) + xp;
    }
  });
}

function subtractXP(xpResult) {
  // Exact reversal of applyXP for delete operations
  state.globalXP = Math.max(0, (state.globalXP||0) - xpResult.total);
  Object.entries(xpResult.statXP||{}).forEach(([k,xp]) => {
    if (!xp) return;
    state.statTrainXP[k] = Math.max(0, (state.statTrainXP[k]||0) - xp);
  });
}

// ---- PENALTY (ANKER-FIX) ----
function checkPenalty() {
  if (state.pause && state.pause.active) return {days:0, active:false};
  // Filter out anchor entry (note === 'ANKER-DATEN')
  const nonAnchorCheckins = (state.checkins||[]).filter(c => c.note !== 'ANKER-DATEN');
  const allDates = [
    ...nonAnchorCheckins.map(c=>c.date),
    ...(state.trainings||[]).map(t=>t.date)
  ];
  if (!allDates.length) return {days:0, active:false};
  const latest = allDates.reduce((a,b) => {
    const da=parseDE(a), db=parseDE(b);
    if (!da) return b; if (!db) return a;
    return da > db ? a : b;
  });
  const days = daysBetween(latest, today());
  if (days >= 4 && state.lastPenaltyDate !== today()) {
    state.lastPenaltyDate = today();
    const pen = [];
    KEYS.forEach(k => {
      if (!STAT_DEFS[k].anchor && (state.stats[k]||1) > 1) {
        state.stats[k] = Math.max(1, (state.stats[k]||1)-1);
        pen.push(k);
      }
    });
    if (pen.length) { addEv('penalty', `PANZER ROSTET: ${days}d inaktiv. Abzug: ${pen.join(',')}`); saveState(); }
    return {days, active:true};
  }
  return {days, active: days>=4};
}

// ---- CHECKIN ----
function processCheckin(f) {
  if (f.taille && f.huefte && parseFloat(f.taille)>0 && parseFloat(f.huefte)>0)
    f.whr = (parseFloat(f.taille)/parseFloat(f.huefte)).toFixed(3);
  if (f.sleepScore && parseFloat(f.sleepScore)>0) {
    const sxp = calcSleepXP(f.sleepScore);
    state.globalXP = (state.globalXP||0)+sxp;
    state.statTrainXP.P = (state.statTrainXP.P||0)+sxp;
    f.sleepXP = sxp;
  }
  state.checkins.push({date:today(), ...f});
  addEv('checkin', `CHECK-IN: ${f.weight}kg · VF${f.visceral}${f.whr?' · WHR:'+f.whr:''}${f.sleepScore?' · Score:'+f.sleepScore:''}`);
  recalcStats();
}

// ---- EGYM ----
function processEgym(exData, modeId) {
  const modeObj = EGYM_MODES.find(m=>m.id===modeId)||EGYM_MODES[3];
  const lastCI = (state.checkins&&state.checkins.length) ? state.checkins.findLast(c=>c&&c.weight) : null;
  const bw = lastCI ? parseFloat(lastCI.weight) : 107.4;
  const score = calcEgymScore(exData);
  const sets = [];
  for (const ex of EGYM_EX) {
    ((exData||{})[ex.id]||[]).forEach(set => {
      if ((parseFloat(set.kg)||0)>0 && (parseFloat(set.wdh)||0)>0)
        sets.push({kg:set.kg, wdh:set.wdh, stat:ex.stat});
    });
  }
  const xpResult = calcEgymXP(sets, bw, modeObj.factor);
  // Store statXP breakdown for exact XP reversal on delete
  const statXPSnapshot = {...xpResult.statXP};
  state.trainings.push({type:'egym', date:today(), score, modeId:modeObj.id, modeFactor:modeObj.factor, sessionXP:xpResult.total, statXP:statXPSnapshot, exData});
  applyXP(xpResult);
  addEv('training', `EGYM [${modeObj.name}]: Score ${score} · +${xpResult.total} XP`);
  recalcStats();
}

// ---- SEIL ----
function processSeil(f) {
  // RPM calculated from jumps + seconds
  const jumps = parseInt(f.jumps||0,10);
  const rpm = dauer > 0 ? Math.round(jumps/dauer) : 0;
  const dauer = parseMinSek(f.dauer);
  const xpResult = calcSeilXP(dauer, rpm);
  const todayIdx = state.trainings.findIndex(t=>t.type==='seil'&&t.date===today());
  if (todayIdx >= 0) {
    const ex = state.trainings[todayIdx];
    const newDauer = parseFloat(ex.dauer||0)+dauer;
    const newRunden = parseInt(ex.runden||0,10)+parseInt(f.runden||0,10);
    const newRPM = newDauer>0 ? (parseFloat(ex.rpm||0)*parseFloat(ex.dauer||0)+rpm*dauer)/newDauer : rpm;
    const combined = calcSeilXP(newDauer, newRPM);
    const delta = Math.max(0, combined.total-(ex.sessionXP||0));
    applyXP({total:delta, statXP:{E:Math.max(0,(combined.statXP.E||0)-(ex.statXP&&ex.statXP.E||0)), A:Math.max(0,(combined.statXP.A||0)-(ex.statXP&&ex.statXP.A||0))}});
    state.trainings[todayIdx] = {...ex, dauer:newDauer, rpm:Math.round(newRPM), runden:newRunden, sessionXP:combined.total, statXP:combined.statXP};
    addEv('training', `SEIL +: ${formatMinSek(newDauer)}min · ${Math.round(newRPM)}RPM`);
  } else {
    state.trainings.push({type:'seil', date:today(), dauer, rpm, runden:parseInt(f.runden||0,10), sessionXP:xpResult.total, statXP:xpResult.statXP});
    applyXP(xpResult);
    addEv('training', `SEIL: ${formatMinSek(dauer)}min · ${rpm}RPM · +${xpResult.total} XP`);
  }
  recalcStats();
}

// ---- BIKE ----
function processBike(f) {
  const dauer = parseMinSek(f.dauer);
  const distanz = parseFloat(f.distanz||0);
  const avgSpeed = dauer > 0 ? Math.round((distanz/(dauer/60))*10)/10 : 0;
  const xpResult = calcBikeXP(distanz, avgSpeed, dauer);
  state.trainings.push({type:'bike', date:today(), distanz, dauer, avgSpeed, maxSpeed:parseFloat(f.maxSpeed||0), sessionXP:xpResult.total, statXP:xpResult.statXP});
  applyXP(xpResult);
  addEv('training', `RAD: ${distanz}km · ${avgSpeed}km/h Ø · +${xpResult.total} XP`);
  recalcStats();
}

// ---- ERGO ----
function processErgo(f) {
  const dauer = parseMinSek(f.dauer);
  const distanz = parseFloat(f.distanz||0);
  const avgSpeed = dauer > 0 ? Math.round((distanz/(dauer/60))*10)/10 : 0;
  const xpResult = calcErgoXP(distanz, avgSpeed, dauer);
  state.trainings.push({type:'ergo', date:today(), distanz, dauer, avgSpeed, sessionXP:xpResult.total, statXP:xpResult.statXP});
  applyXP(xpResult);
  addEv('training', `ERGO: ${formatMinSek(dauer)}min · ${distanz?distanz+'km':'--'} · +${xpResult.total} XP`);
  recalcStats();
}

// ---- SUPPLEMENTS ----
function toggleKernSupp(id) {
  const d = today();
  if (!state.supplements[d]) state.supplements[d] = {};
  state.supplements[d][id] = !state.supplements[d][id];
  recalcAllStreaks();
  addEv('chem', `${state.supplements[d][id]?'✓':'✗'} ${id.toUpperCase()}`);
  recalcStats();
}

function toggleKsm() {
  if (!state.ksm.cycleStart) {
    state.ksm.cycleStart = new Date().toISOString();
    addEv('chem','KSM-66 Zyklus gestartet. 56 Tage ON.');
  }
  const ks = getKsmState();
  if (ks.phase==='off') return;
  const taken = state.ksm.lastTakenDate===today();
  state.ksm.lastTakenDate = taken ? '' : today();
  addEv('chem', `${taken?'✗':'✓'} KSM-66 (Tag ${ks.dayInPhase}/${KSM_ON})`);
  saveState();
}

function startBkomp() {
  localStorage.setItem('panzer_bkur_start', new Date().toISOString());
  addEv('chem','B-Komplex Kur gestartet. 21/14.');
  saveState();
}

function resetBkomp() {
  if (!confirm('B-Komplex Zyklus zurücksetzen?')) return;
  localStorage.removeItem('panzer_bkur_start');
  addEv('chem','B-Komplex Zyklus zurückgesetzt.');
  saveState();
}

function loadDailyOpt() {
  try {
    const raw = localStorage.getItem(DAILY_OPT_KEY);
    const data = raw ? JSON.parse(raw) : {date:today(), checked:{}};
    if (data.date !== today()) return {date:today(), checked:{}};
    return data;
  } catch(e) { return {date:today(), checked:{}}; }
}

function saveDailyOpt(d) { try { localStorage.setItem(DAILY_OPT_KEY, JSON.stringify(d)); } catch(e) {} }

function toggleOptSupp(id) {
  const d = loadDailyOpt();
  d.checked[id] = !d.checked[id];
  saveDailyOpt(d);
  addEv('chem', `${d.checked[id]?'✓':'✗'} ${id.toUpperCase()}`);
}

// ---- PAUSE ----
function startPause(reason) {
  state.pause = {active:true, reason:reason||'Krankheit', startDate:today()};
  addEv('system', `Pause gestartet: ${state.pause.reason}`);
  saveState();
}

function endPause() {
  state.pause = {active:false, reason:'', startDate:''};
  state.lastPenaltyDate = today();
  addEv('system','Pause beendet.');
  saveState();
}

// ---- EXPORT / IMPORT ----
function exportData() {
  const exp = JSON.parse(JSON.stringify(state));
  exp._bkurStart = localStorage.getItem('panzer_bkur_start')||null;
  exp._dailyOpt = localStorage.getItem(DAILY_OPT_KEY)||null;
  const b = new Blob([JSON.stringify(exp,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = `wasteland-panzer-v3-${today().replace(/\./g,'-')}.json`;
  a.click();
}

function importData(file, onDone) {
  const r = new FileReader();
  r.onload = ev => {
    try {
      const imp = JSON.parse(ev.target.result);
      if (imp.stats && imp.checkins) {
        if (imp._bkurStart) localStorage.setItem('panzer_bkur_start', imp._bkurStart);
        if (imp._dailyOpt) localStorage.setItem(DAILY_OPT_KEY, imp._dailyOpt);
        if (imp._ksmStart && imp.ksm) imp.ksm.cycleStart = imp._ksmStart;
        delete imp._bkurStart; delete imp._ksmStart; delete imp._dailyOpt;
        if (!imp.pause) imp.pause = {active:false,reason:'',startDate:''};
        if (!imp.questState) imp.questState = {};
        if (!imp.ksm) imp.ksm = {cycleStart:null,lastTakenDate:''};
        if (!Array.isArray(imp.trainings)) imp.trainings = [];
        Object.assign(state, imp);
        recalcAllStreaks(); recalcStats();
        saveState();
        if (onDone) onDone(true);
      } else { if (onDone) onDone(false); }
    } catch(e) { if (onDone) onDone(false); }
  };
  r.readAsText(file);
}

function migrateAndInit() {
  if (!state.mastery) state.mastery = {};
  if (!state.masteryLevel) state.masteryLevel = {};
  state.trainings.forEach(t => {
    if (t.type==='egym' && !t.exData) {
      const exData = {};
      EGYM_EX.forEach(ex => {
        const kg=t[ex.id+'_kg'], wdh=t[ex.id+'_wdh'];
        if (kg||wdh) exData[ex.id] = [{kg:kg||0,wdh:wdh||0}];
      });
      t.exData = exData;
      t.score = calcEgymScore(exData);
    }
    // Ensure statXP snapshot exists for delete reversal
    if (!t.statXP) t.statXP = {};
  });
  recalcAllStreaks();
  recalcStats();
  checkPenalty();
}

migrateAndInit();

// ---- TOAST ----
let _tTimer = null;
function toast(msg, type='') {
  clearTimeout(_tTimer);
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' '+type : '');
  t.textContent = msg;
  document.body.appendChild(t);
  _tTimer = setTimeout(() => t.remove(), 2500);
}

// ---- RADAR ----
function drawRadar(canvas) {
  const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2, R=Math.min(W,H)*0.37;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  const labels=['STR','PER','END','INT','AGI','LCK'];
  const keys=['S','P','E','I','A','L'];
  const N=6;
  const vals = keys.map(k => state.stats[k]);

  const pt = (i,v) => {
    const a = (Math.PI*2*i/N) - Math.PI/2;
    return {x: cx+R*(v/10)*Math.cos(a), y: cy+R*(v/10)*Math.sin(a)};
  };
  const op = i => {
    const a = (Math.PI*2*i/N) - Math.PI/2;
    return {x: cx+R*Math.cos(a), y: cy+R*Math.sin(a)};
  };

  for (let ring=2; ring<=10; ring+=2) {
    ctx.beginPath();
    for (let i=0;i<N;i++) { const p=pt(i,ring); if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); }
    ctx.closePath();
    ctx.strokeStyle = ring===10 ? 'rgba(68,255,68,0.3)' : 'rgba(68,255,68,0.1)';
    ctx.lineWidth=1; ctx.stroke();
  }
  for (let i=0;i<N;i++) {
    const o=op(i); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(o.x,o.y);
    ctx.strokeStyle='rgba(68,255,68,0.2)'; ctx.lineWidth=1; ctx.stroke();
  }
  ctx.beginPath();
  vals.forEach((v,i) => { const p=pt(i,v); if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
  ctx.closePath();
  ctx.fillStyle='rgba(68,255,68,0.15)'; ctx.fill();
  ctx.strokeStyle='rgba(68,255,68,0.9)'; ctx.lineWidth=2;
  ctx.shadowColor='#44ff44'; ctx.shadowBlur=8; ctx.stroke(); ctx.shadowBlur=0;
  vals.forEach((v,i) => {
    const p=pt(i,v);
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fillStyle='#44ff44'; ctx.shadowColor='#44ff44'; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
  });
  ctx.textAlign='center'; ctx.textBaseline='middle';
  labels.forEach((lbl,i) => {
    const a=(Math.PI*2*i/N)-Math.PI/2;
    ctx.font='bold 8px "Share Tech Mono"'; ctx.fillStyle='#88cc88';
    ctx.shadowColor='#44ff44'; ctx.shadowBlur=3;
    ctx.fillText(lbl, cx+(R+16)*Math.cos(a), cy+(R+16)*Math.sin(a));
    const vp=pt(i,vals[i]);
    ctx.font='bold 9px "Orbitron"'; ctx.fillStyle='#aaffaa'; ctx.shadowBlur=5;
    ctx.fillText(vals[i], vp.x+Math.cos(a)*9, vp.y+Math.sin(a)*9);
  });
  ctx.shadowBlur=0;
}

// ---- SPARKLINE ----
function drawSparkline(canvas, values, isGood) {
  if (!canvas || values.length<2) return;
  const W=canvas.width, H=canvas.height, ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  const min=Math.min(...values), max=Math.max(...values), range=max-min||1;
  const pts=values.map((v,i) => ({x:(i/(values.length-1))*W, y:H-((v-min)/range)*(H-4)-2}));
  const col=isGood?'rgba(68,255,68,':'rgba(255,68,68,';
  ctx.beginPath(); ctx.moveTo(pts[0].x,H);
  pts.forEach(p => ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x,H); ctx.closePath();
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,col+'0.3)'); g.addColorStop(1,col+'0.02)');
  ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); pts.forEach((p,i) => { if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
  ctx.strokeStyle=isGood?'rgba(68,255,68,0.9)':'rgba(255,68,68,0.8)';
  ctx.lineWidth=1.5; ctx.shadowColor=isGood?'#44ff44':'#ff4444'; ctx.shadowBlur=4;
  ctx.stroke(); ctx.shadowBlur=0;
  const last=pts[pts.length-1];
  ctx.beginPath(); ctx.arc(last.x,last.y,2.5,0,Math.PI*2);
  ctx.fillStyle=isGood?'#44ff44':'#ff4444'; ctx.shadowColor=isGood?'#44ff44':'#ff4444';
  ctx.shadowBlur=7; ctx.fill(); ctx.shadowBlur=0;
}

// ---- CHECKIN VALIDATION ----
const VALIDATION_LIMITS = {weight:2.0, muscle:1.5, fat:1.5, visceral:1.0};

function validateCheckin(f) {
  const errors = {};
  const latest = state.checkins[state.checkins.length-1]||{};
  if (!latest) return {valid:true, errors};
  ['weight','muscle','fat','visceral'].forEach(k => {
    if (!f[k] || !latest[k]) return;
    const diff = Math.abs(parseFloat(f[k]) - parseFloat(latest[k]));
    if (diff > VALIDATION_LIMITS[k]) {
      errors[k] = `Abweichung ${diff.toFixed(1)} > Limit ${VALIDATION_LIMITS[k]}`;
    }
  });
  return {valid: Object.keys(errors).length === 0, errors};
}

  });

  h += '</div>';
  h += '<button class="btn ghost sm" onclick="resetDayProtocol()">Tagesprotokoll zurücksetzen</button>';
  h += '<div class="page-footer">V3.8.20260603 — WASTELAND PANZER</div>';
  h += '</div></div>';
  root.innerHTML = h;
}

function doToggleKern(id) { toggleKernSupp(id); render(); }

function doToggleOpt(id) {
  if (id === 'bkomplex') {
    var d = loadDailyOpt();
    d.checked['bkomplex'] = !d.checked['bkomplex'];
    saveDailyOpt(d);
    addEv('chem', (d.checked['bkomplex']?'CHECK ':'X ') + 'B-KOMPLEX');
  } else {
    toggleOptSupp(id);
  }
  recalcAllStreaks(); recalcStats(); saveState(); render();
}

function doToggleKsm() { toggleKsm(); render(); }

function startKsmKur() {
  if (!state.ksm.cycleStart) { state.ksm.cycleStart = new Date().toISOString(); addEv('chem','KSM-66 Zyklus gestartet.'); saveState(); }
  render();
}

function startBkompAndRender() { startBkomp(); render(); }

function resetDayProtocol() {
  if (!confirm('Tagesprotokoll zurücksetzen?')) return;
  saveDailyOpt({date:today(), checked:{}});
  if (state.supplements[today()]) { state.supplements[today()] = {}; }
  recalcAllStreaks(); recalcStats(); saveState(); render();
}

render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
