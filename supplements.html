<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WASTELAND PANZER">
<title>SUPPLEMENTS — WASTELAND PANZER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<style>/* injected */</style>
</head>
<body>
<div id="root"></div>
<script src="themes.js"></script>
<script src="core.js"></script>
<script>
// ---- SUPPLEMENTS PAGE v3.2 ----

function render() {
  const root = document.getElementById('root');
  const penSt = checkPenalty();
  const todaySupps = state.supplements[today()] || {};
  const dailyOpt = loadDailyOpt();
  const ksmSt = getKsmState();
  const bkSt = getBkompState();

  const kernTaken = KERN_SUPPS.filter(s => todaySupps[s.id]).length;
  const kernTotal = KERN_SUPPS.length;
  const todayDate = today();
  const hdlTaken = !!(state.supplements[todayDate] && state.supplements[todayDate]['heidelberger']);
  const bkOn = bkSt.phase === 'on';
  const ksmOn = ksmSt.phase === 'on';
  const bkTaken = bkOn && !!dailyOpt.checked['bkomplex'];
  const ksmTaken = ksmOn && state.ksm.lastTakenDate === today();

  // Protokoll-Balken: nur Kern-Supps
  const reqCount = kernTotal;
  const takenCount = kernTaken;
  const pct = reqCount > 0 ? Math.round((takenCount/reqCount)*100) : 0;
  const complete = takenCount >= reqCount;

  let h = renderHeader('supplements.html');
  if (penSt.active) h += '<div class="penalty-bar">PANZER ROSTET — ' + penSt.days + ' TAGE INAKTIV</div>';

  h += '<div class="supp-progress">';
  h += '<div class="supp-progress-lbl">PROTOKOLL</div>';
  h += '<div class="supp-progress-track"><div class="supp-progress-fill' + (complete?' done':'') + '" style="width:' + pct + '%"></div></div>';
  h += '<div class="supp-progress-num" style="color:' + (complete?'var(--amber)':'var(--purple)') + '">' + takenCount + '/' + reqCount + (complete?' CHECK':'') + '</div>';
  h += '</div>';

  h += '<div class="scroll"><div class="pad">';

  if (complete) {
    h += '<div style="background:#0a0800;border:1px solid var(--amber);padding:7px 12px;margin-bottom:8px;text-align:center"><div style="font-family:var(--fontd);font-size:11px;color:var(--amber);letter-spacing:2px">PROTOKOLL ABGESCHLOSSEN</div></div>';
  }

  // KERN-SUPPS
  h += '<div class="sec-title" style="border-top:none;margin-top:0">KERN-SUPPS — 7 PFLICHT</div>';
  h += '<div style="border:1px solid var(--gdim);margin-bottom:10px;">';
  KERN_SUPPS.forEach(function(sup, i) {
    var taken = !!todaySupps[sup.id];
    var streak = state.suppStreaks[sup.id] || 0;
    var isLast = i === KERN_SUPPS.length - 1;
    h += '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:' + (isLast?'none':'1px solid var(--g2)') + ';background:' + (taken?'rgba(170,68,255,0.05)':'transparent') + ';cursor:pointer;" onclick="doToggleKern(\'' + sup.id + '\')">';
    h += '<div style="width:22px;height:22px;border:1px solid ' + (taken?'var(--purple)':'var(--adim)') + ';background:' + (taken?'var(--purple)':'transparent') + ';display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:bold;color:#fff;">' + (taken?'✓':'') + '</div>';
    h += '<div style="font-size:18px;flex-shrink:0;">' + sup.icon + '</div>';
    h += '<div style="flex:1;"><div style="font-size:10px;color:' + (taken?'var(--purple)':'var(--tb)') + ';">' + sup.name + '</div><div style="font-size:8px;color:var(--gdim);">' + sup.dose + '</div></div>';
    h += '<div style="font-family:var(--fontd);font-size:14px;color:' + (taken?'var(--purple)':'var(--adim)') + ';margin-right:6px;">' + streak + '<span style="font-size:7px;font-family:var(--font)">d</span></div>';
    h += '<div style="width:22px;height:22px;border:1px solid var(--gdim);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--gdim);cursor:pointer;flex-shrink:0;" onclick="event.stopPropagation();toast(\'' + sup.icon + ' ' + sup.name + ': ' + sup.dose + ' | ' + sup.desc + '\')">i</div>';
    h += '</div>';
  });
  h += '</div>';

  // OPT-SUPPS
  h += '<div class="sec-title">OPTIONALE SUPPS — 4 SITUATIV</div>';
  h += '<div style="border:1px solid var(--gdim);margin-bottom:10px;">';

  OPT_SUPPS.forEach(function(sup, i) {
    var isLast = i === OPT_SUPPS.length - 1;
    var isKsm = sup.id === 'ashwa';
    var isBk = sup.id === 'bkomplex';
    var taken = false;
    var disabled = false;
    var subLabel = sup.dose;
    var clickFn = 'doToggleOpt(\'' + sup.id + '\')';

    if (isKsm) {
      taken = ksmOn && state.ksm.lastTakenDate === today();
      disabled = ksmSt.phase === 'off';
      if (ksmSt.phase === 'idle') { subLabel = 'Kur nicht gestartet'; clickFn = 'startKsmKur()'; }
      else if (ksmSt.phase === 'on') { subLabel = 'Tag ' + ksmSt.dayInPhase + '/' + KSM_ON + ' ON | ' + sup.dose; clickFn = 'doToggleKsm()'; }
      else { subLabel = 'PAUSE — noch ' + (KSM_OFF - ksmSt.dayInPhase) + ' Tage'; clickFn = ''; }
    } else if (isBk) {
      taken = bkOn && !!dailyOpt.checked['bkomplex'];
      disabled = bkSt.phase === 'off';
      if (bkSt.phase === 'idle') { subLabel = 'Kur nicht gestartet'; clickFn = 'startBkompAndRender()'; }
      else if (bkSt.phase === 'on') { subLabel = 'Tag ' + bkSt.dayInPhase + '/' + BKOMP_ON + ' ON | ' + sup.dose; clickFn = 'doToggleOpt(\'bkomplex\')'; }
      else { subLabel = 'PAUSE — noch ' + (BKOMP_OFF - bkSt.dayInPhase) + ' Tage'; clickFn = ''; }
    } else {
      taken = !!dailyOpt.checked[sup.id];
    }

    var textCol = disabled ? 'var(--gdim)' : taken ? 'var(--purple)' : 'var(--tb)';
    var borderCol = disabled ? 'var(--g2)' : taken ? 'var(--purple)' : 'var(--gdim)';

    h += '<div style="border-bottom:' + (isLast?'none':'1px solid var(--g2)') + ';">';
    h += '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:' + (taken?'rgba(170,68,255,0.05)':'transparent') + ';opacity:' + (disabled?'0.4':'1') + ';cursor:' + (disabled||!clickFn?'default':'pointer') + ';" ' + (clickFn?'onclick="' + clickFn + '"':'') + '>';
    h += '<div style="width:22px;height:22px;border:1px solid ' + borderCol + ';background:' + (taken?'var(--purple)':'transparent') + ';display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:bold;color:#fff;">' + (taken?'v':'') + '</div>';
    h += '<div style="font-size:18px;flex-shrink:0;">' + sup.icon + '</div>';
    h += '<div style="flex:1;"><div style="font-size:10px;color:' + textCol + ';">' + sup.name + '</div><div style="font-size:8px;color:var(--gdim);">' + subLabel + '</div></div>';

    if ((isKsm||isBk) && !disabled && (isKsm?ksmSt:bkSt).phase !== 'idle') {
      var st2 = isKsm ? ksmSt : bkSt;
      h += '<div style="width:44px;"><div style="height:4px;background:var(--g1);border:1px solid var(--gdim);overflow:hidden;"><div style="height:100%;width:' + st2.pct + '%;background:var(--purple);"></div></div></div>';
    }

    h += '<div style="width:22px;height:22px;border:1px solid var(--gdim);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--gdim);cursor:pointer;flex-shrink:0;" onclick="event.stopPropagation();toast(\'' + sup.icon + ' ' + sup.name + ': ' + sup.dose + ' | ' + sup.desc + '\')">i</div>';
    h += '</div>';

    if (isKsm && ksmSt.phase === 'idle') h += '<div style="padding:6px 12px;"><button class="btn sm" style="margin-top:0;border-color:var(--purple);color:var(--purple)" onclick="startKsmKur()">ZYKLUS STARTEN 56/14</button></div>';
    if (isBk && bkSt.phase === 'idle') h += '<div style="padding:6px 12px;"><button class="btn sm" style="margin-top:0;border-color:var(--purple);color:var(--purple)" onclick="startBkompAndRender()">ZYKLUS STARTEN 21/14</button></div>';
    if (isBk && bkSt.phase !== 'idle') h += '<div style="padding:2px 12px 6px;"><span style="font-size:7px;color:var(--gdim);cursor:pointer;text-decoration:underline" onclick="resetBkomp();render()">Zyklus zurücksetzen</span></div>';

    h += '</div>';
  });

  h += '</div>';
  h += '<button class="btn ghost sm" onclick="resetDayProtocol()">Tagesprotokoll zurücksetzen</button>';
  h += '<div class="page-footer">V5.2 · ' + new Date(document.lastModified).toLocaleDateString('de-DE') + ' ' + new Date(document.lastModified).toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'}) + '</div>';
  h += '</div></div>';
  root.innerHTML = h;
}

function doToggleKern(id) { toggleKernSupp(id); render(); }

function doToggleHeidel() {
  var d = today();
  if (!state.supplements[d]) state.supplements[d] = {};
  state.supplements[d]['heidelberger'] = !state.supplements[d]['heidelberger'];
  addEv('chem', (state.supplements[d]['heidelberger'] ? '✓' : '✗') + ' HEIDELBERGER');
  recalcAllStreaks(); saveState(); render();
}

function doToggleOpt(id) {
  if (id === 'bkomplex') {
    var d = loadDailyOpt();
    d.checked['bkomplex'] = !d.checked['bkomplex'];
    saveDailyOpt(d);
    addEv('chem', (d.checked['bkomplex']?'CHECK ':'X ') + 'B-KOMPLEX');
  } else {
    toggleOptSupp(id);
  }
  recalcAllStreaks(); recalcStats(); saveState(); render();
}

function toggleBkompToday() {
  var d = loadDailyOpt();
  d.checked['bkomplex'] = !d.checked['bkomplex'];
  saveDailyOpt(d);
  addEv('chem', (d.checked['bkomplex']?'CHECK ':'X ') + 'B-KOMPLEX');
  recalcAllStreaks(); recalcStats(); saveState(); render();
}

function doToggleKsm() { toggleKsm(); render(); }

function startKsmKur() {
  if (!state.ksm.cycleStart) { state.ksm.cycleStart = new Date().toISOString(); addEv('chem','KSM-66 Zyklus gestartet.'); saveState(); }
  render();
}

function startBkompAndRender() { startBkomp(); render(); }

function resetDayProtocol() {
  if (!confirm('Tagesprotokoll zurücksetzen?')) return;
  saveDailyOpt({date:today(), checked:{}});
  if (state.supplements[today()]) { state.supplements[today()] = {}; }
  recalcAllStreaks(); recalcStats(); saveState(); render();
}

render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
