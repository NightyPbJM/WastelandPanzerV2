<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WASTELAND PANZER">
<title>QUESTS — WASTELAND PANZER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<style>/* injected */</style>
</head>
<body>
<div id="root"></div>
<script src="themes.js"></script>
<script src="core.js"></script>
<script>
// ---- QUEST PAGE v3.6 ----

function getWeekKey() {
  var d = new Date();
  var mon = new Date(d);
  mon.setDate(d.getDate() - ((d.getDay()+6)%7));
  return mon.toLocaleDateString('de-DE');
}

function loadQuestState() {
  if (!state.questState) state.questState = {};
  var wk = getWeekKey();
  if (!state.questState.weekly) state.questState.weekly = {};
  if (!state.questState.weekly[wk]) state.questState.weekly[wk] = {claimed:{}};
  if (!state.questState.milestones) state.questState.milestones = {};
  if (!state.questState.leber) state.questState.leber = {claimed1:false, claimed2:false};
  return state.questState;
}

// ---- WEEKLY RAIDS ----
var WEEKLY_RAIDS = [
  {
    id:'eisen_biegen', name:'EISEN BIEGEN',
    desc:'EGYM an 2+ verschiedenen Tagen diese Woche',
    reward:'+100 XP', rewardXP:100, rewardStat:'S',
    check: function() {
      var wkDate = parseDE(getWeekKey());
      var wkEnd = new Date(wkDate); wkEnd.setDate(wkEnd.getDate()+6); wkEnd.setHours(23,59,59);
      var days = new Set(state.trainings.filter(function(t) {
        if (t.type!=='egym') return false;
        var td = parseDE(t.date);
        return td && td >= wkDate && td <= wkEnd;
      }).map(function(t){return t.date;}));
      return days.size;
    }, goal:2
  },
  {
    id:'wieselflink', name:'WIESELFLINK',
    desc:'Seil/Rad/Ergo an 2+ verschiedenen Tagen diese Woche',
    reward:'+100 XP', rewardXP:100, rewardStat:'A',
    check: function() {
      var wkDate = parseDE(getWeekKey());
      var wkEnd = new Date(wkDate); wkEnd.setDate(wkEnd.getDate()+6); wkEnd.setHours(23,59,59);
      var days = new Set(state.trainings.filter(function(t) {
        if (!['seil','bike','ergo'].includes(t.type)) return false;
        var td = parseDE(t.date);
        return td && td >= wkDate && td <= wkEnd;
      }).map(function(t){return t.date;}));
      return days.size;
    }, goal:2
  },
  {
    id:'bitterer_ernst', name:'BITTERER ERNST',
    desc:'Heidelberger 5x diese Woche',
    reward:'+100 XP', rewardXP:100, rewardStat:'C',
    check: function() {
      // Zähle Tage dieser Woche wo Heidelberger in state.supplements eingetragen ist
      var wkDate = parseDE(getWeekKey());
      var wkEnd = new Date(wkDate); wkEnd.setDate(wkEnd.getDate()+6); wkEnd.setHours(23,59,59);
      var count = 0;
      Object.keys(state.supplements||{}).forEach(function(date) {
        var d = parseDE(date);
        if (!d || d < wkDate || d > wkEnd) return;
        if (state.supplements[date]['heidelberger']) count++;
      });
      return count;
    }, goal:5
  },
  {
    id:'coop_support', name:'CO-OP SUPPORT',
    desc:'Frayas Handball begleitet',
    reward:'+100 XP', rewardXP:100, rewardStat:'L',
    check: function() {
      var qs = loadQuestState();
      return qs.weekly[getWeekKey()].coop ? 1 : 0;
    }, goal:1
  },
];

// ---- MILESTONE QUESTS ----
var MILESTONES = [
  {id:'whr_093', name:'TAILLE KONTROLLIERT', desc:'WHR < 0.93 erreichen', reward:'+200 XP', rewardXP:200,
    check: function() {
      var l = state.checkins.findLast(function(c){return c&&c.taille&&c.huefte&&parseFloat(c.taille)>0;});
      return l ? parseFloat(l.taille)/parseFloat(l.huefte) < 0.93 : false;
    }
  },
  {id:'whr_087', name:'SCHLANK & STARK', desc:'WHR < 0.87 erreichen', reward:'+500 XP', rewardXP:500,
    check: function() {
      var l = state.checkins.findLast(function(c){return c&&c.taille&&c.huefte&&parseFloat(c.taille)>0;});
      return l ? parseFloat(l.taille)/parseFloat(l.huefte) < 0.87 : false;
    }
  },
  {id:'vf_12', name:'ABRISS STUFE 1', desc:'Viszeralfett < 12', reward:'+150 XP', rewardXP:150,
    check: function() {
      var l = state.checkins.findLast(function(c){return c&&c.visceral&&parseFloat(c.visceral)>0;});
      return l ? parseFloat(l.visceral) < 12 : false;
    }
  },
  {id:'vf_11', name:'ABRISS STUFE 2', desc:'Viszeralfett < 11', reward:'+250 XP', rewardXP:250,
    check: function() {
      var l = state.checkins.findLast(function(c){return c&&c.visceral&&parseFloat(c.visceral)>0;});
      return l ? parseFloat(l.visceral) < 11 : false;
    }
  },
  {id:'vf_10', name:'ABRISS STUFE 3', desc:'Viszeralfett < 10', reward:'+400 XP', rewardXP:400,
    check: function() {
      var l = state.checkins.findLast(function(c){return c&&c.visceral&&parseFloat(c.visceral)>0;});
      return l ? parseFloat(l.visceral) < 10 : false;
    }
  },
  {id:'vf_9', name:'ABRISS DES DACHSCHADENS', desc:'Viszeralfett < 9 — FINALE', reward:'+600 XP', rewardXP:600,
    check: function() {
      var l = state.checkins.findLast(function(c){return c&&c.visceral&&parseFloat(c.visceral)>0;});
      return l ? parseFloat(l.visceral) < 9 : false;
    }
  },
];

// ---- LEBER-RETTER ----
function getLeberStreak() {
  // Zählt aufeinander folgende Tage mit Cholin + Inositol eingenommen
  var dates = Object.keys(state.supplements).sort(function(a,b){
    var da=parseDE(a), db=parseDE(b);
    return db-da; // newest first
  });
  var streak = 0;
  for (var i=0; i<dates.length; i++) {
    var d = state.supplements[dates[i]];
    if (d && d['cholin'] && d['inositol']) streak++;
    else break;
  }
  return streak;
}

function getLatestVF() {
  var l = state.checkins.findLast(function(c){return c&&c.visceral&&parseFloat(c.visceral)>0;});
  return l ? parseFloat(l.visceral) : 99;
}

function claimRaid(id) {
  var raid = WEEKLY_RAIDS.find(function(r){return r.id===id;});
  if (!raid) return;
  var qs = loadQuestState();
  var wk = getWeekKey();
  if (qs.weekly[wk].claimed[id]) return;
  if (raid.check() < raid.goal) { toast('Noch nicht erfüllt','err'); return; }
  qs.weekly[wk].claimed[id] = true;
  state.globalXP = (state.globalXP||0) + raid.rewardXP;
  state.questStatXP[raid.rewardStat] = (state.questStatXP[raid.rewardStat]||0) + raid.rewardXP;
  addEv('training', 'RAID: ' + raid.name + ' · ' + raid.reward);
  toast(raid.reward, 'amber');
  recalcStats(); saveState(); render();
}

function claimMilestone(id) {
  var ms = MILESTONES.find(function(m){return m.id===id;});
  if (!ms) return;
  var qs = loadQuestState();
  if (qs.milestones[id]) return;
  if (!ms.check()) { toast('Bedingung nicht erfüllt','err'); return; }
  qs.milestones[id] = true;
  state.globalXP = (state.globalXP||0) + ms.rewardXP;
  addEv('training', 'MILESTONE: ' + ms.name + ' · ' + ms.reward);
  toast(ms.reward, 'amber');
  saveState(); render();
}

function claimLeber(stufe) {
  var qs = loadQuestState();
  var streak = getLeberStreak();
  var vf = getLatestVF();
  if (stufe===1) {
    if (qs.leber.claimed1) return;
    if (streak < 30 || vf >= 12) { toast('Bedingung nicht erfüllt — 30d Streak + VF < 12','err'); return; }
    qs.leber.claimed1 = true;
    state.globalXP = (state.globalXP||0) + 300;
    addEv('training', 'LEBER-RETTER STUFE 1 · +300 XP');
    toast('+300 XP', 'amber');
  } else {
    if (qs.leber.claimed2) return;
    if (streak < 60 || vf >= 10) { toast('Bedingung nicht erfüllt — 60d Streak + VF < 10','err'); return; }
    qs.leber.claimed2 = true;
    state.globalXP = (state.globalXP||0) + 800;
    addEv('training', 'LEBER-RETTER STUFE 2 · +800 XP');
    toast('+800 XP', 'amber');
  }
  saveState(); render();
}

function toggleCoop() {
  var qs = loadQuestState();
  var wk = getWeekKey();
  qs.weekly[wk].coop = !qs.weekly[wk].coop;
  saveState(); render();
}

function render() {
  var root = document.getElementById('root');
  var qs = loadQuestState();
  var wk = getWeekKey();
  var streak = getLeberStreak();
  var vf = getLatestVF();

  var h = renderHeader('quest.html');
  h += '<div class="scroll"><div class="pad">';

  // LEGENDE STATUS
  var legendeUnlocked = vf < 9;
  h += '<div style="border:1px solid ' + (legendeUnlocked?'var(--amber)':'var(--gdim)') + ';padding:8px 12px;margin-bottom:10px;text-align:center;background:' + (legendeUnlocked?'#0a0800':'var(--gfaint)') + '">';
  h += '<div style="font-family:var(--fontd);font-size:13px;color:' + (legendeUnlocked?'var(--amber)':'var(--gdim)') + ';letter-spacing:3px">LEGENDE</div>';
  h += '<div style="font-size:8px;color:var(--gdim);margin-top:2px">' + (legendeUnlocked?'STATUS ERREICHT':'Viszeralfett < 9 erforderlich · aktuell: '+vf) + '</div>';
  h += '</div>';

  // LEBER-RETTER
  h += '<div class="sec-title" style="border-top:none;margin-top:0">LEBER-RETTER</div>';
  var leberPairs = [
    {stufe:1, streakReq:30, vfReq:12, xp:300, claimed:qs.leber.claimed1},
    {stufe:2, streakReq:60, vfReq:10, xp:800, claimed:qs.leber.claimed2},
  ];
  leberPairs.forEach(function(lp) {
    var streakOk = streak >= lp.streakReq;
    var vfOk = vf < lp.vfReq;
    var ready = streakOk && vfOk;
    var col = lp.claimed?'var(--amber)':ready?'var(--glow)':'var(--gdim)';
    h += '<div class="quest-card' + (lp.claimed?' done':'') + '" style="border-color:' + col + '">';
    h += '<span class="quest-badge ' + (lp.claimed?'dauerquest':'active') + '">[LEBER]</span>';
    h += '<span class="quest-status ' + (lp.claimed?'done':ready?'active':'locked') + '">' + (lp.claimed?'CLAIMED':ready?'CLAIMBAR':'LOCKED') + '</span>';
    h += '<div class="quest-name">LEBER-RETTER STUFE ' + lp.stufe + '</div>';
    h += '<div class="quest-req">' + lp.streakReq + 'T Streak (Cholin+Inositol) + VF &lt; ' + lp.vfReq + '</div>';
    h += '<div class="quest-reward">+' + lp.xp + ' XP</div>';
    h += '<div class="quest-progress">';
    h += '<div style="font-size:8px;color:var(--gdim)">Streak: ' + streak + '/' + lp.streakReq + ' · VF: ' + vf + ' (Ziel &lt;' + lp.vfReq + ')</div>';
    h += '<div class="quest-prog-bar"><div class="quest-prog-fill" style="width:' + Math.min(100,Math.round((streak/lp.streakReq)*100)) + '%;background:' + (streakOk?'var(--glow)':'var(--blue)') + '"></div></div>';
    h += '</div>';
    if (ready && !lp.claimed) h += '<button class="btn sm amber" onclick="claimLeber(' + lp.stufe + ')">BELOHNUNG ABHOLEN</button>';
    h += '</div>';
  });

  // MEILENSTEINE
  h += '<div class="sec-title">MEILENSTEINE</div>';
  MILESTONES.forEach(function(ms) {
    var fulfilled = ms.check();
    var claimed = !!qs.milestones[ms.id];
    var col = claimed?'var(--amber)':fulfilled?'var(--glow)':'var(--gdim)';
    h += '<div class="quest-card' + (claimed?' done':'') + '" style="border-color:' + col + '">';
    h += '<span class="quest-badge ' + (claimed?'dauerquest':fulfilled?'active':'locked') + '">[MILESTONE]</span>';
    h += '<span class="quest-status ' + (claimed?'done':fulfilled?'active':'locked') + '">' + (claimed?'CLAIMED':fulfilled?'CLAIMBAR':'LOCKED') + '</span>';
    h += '<div class="quest-name">' + ms.name + '</div>';
    h += '<div class="quest-req">' + ms.desc + '</div>';
    h += '<div class="quest-reward">' + ms.reward + '</div>';
    if (fulfilled && !claimed) h += '<button class="btn sm amber" onclick="claimMilestone(\'' + ms.id + '\')">ABHOLEN</button>';
    h += '</div>';
  });

  // WEEKLY RAIDS
  h += '<div class="sec-title">WEEKLY RAIDS — ' + wk + '</div>';
  WEEKLY_RAIDS.forEach(function(raid) {
    var progress = raid.check();
    var pct = Math.min(100, Math.round((progress/raid.goal)*100));
    var done = progress >= raid.goal;
    var claimed = !!(qs.weekly[wk].claimed[raid.id]);
    var col = claimed?'var(--amber)':done?'var(--glow)':'var(--gdim)';

    h += '<div class="quest-card' + (claimed?' done':'') + '" style="border-color:' + col + '">';
    h += '<span class="quest-badge weekly">[RAID]</span>';
    h += '<span class="quest-status ' + (claimed?'done':done?'active':'locked') + '">' + (claimed?'CLAIMED':done?'CLAIMBAR':'IN PROGRESS') + '</span>';
    h += '<div class="quest-name">' + raid.name + '</div>';
    h += '<div class="quest-req">' + raid.desc + '</div>';
    h += '<div class="quest-reward">' + raid.reward + '</div>';

    if (raid.id==='coop_support') {
      h += '<div style="margin-top:6px"><button class="btn sm' + (qs.weekly[wk].coop?' amber':' ghost') + '" onclick="toggleCoop()">' + (qs.weekly[wk].coop?'BEGLEITET':'BEGLEITET?') + '</button></div>';
    } else {
      h += '<div class="quest-progress"><div style="font-size:8px;color:var(--gdim)">' + progress + '/' + raid.goal + '</div>';
      h += '<div class="quest-prog-bar"><div class="quest-prog-fill" style="width:' + pct + '%"></div></div></div>';
    }
    if (done && !claimed) h += '<button class="btn sm amber" onclick="claimRaid(\'' + raid.id + '\')">BELOHNUNG ABHOLEN</button>';
    h += '</div>';
  });

  h += '<div class="page-footer">V5.2 · ' + new Date(document.lastModified).toLocaleDateString('de-DE') + ' ' + new Date(document.lastModified).toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'}) + '</div>';
  h += '</div></div>';
  root.innerHTML = h;
}

render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
