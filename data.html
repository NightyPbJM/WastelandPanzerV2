<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WASTELAND PANZER">
<title>DATEN — WASTELAND PANZER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<style>/* injected */</style>
</head>
<body>
<div id="root"></div>
<script src="themes.js"></script>
<script src="core.js"></script>
<script>
// ---- DATA PAGE v3.2 ----
var modal = null;
var installPrompt = null;
var showInstall = false;

function render() {
  var root = document.getElementById('root');
  var penSt = checkPenalty();
  var h = renderHeader('data.html');
  if (penSt.active) h += '<div class="penalty-bar">PANZER ROSTET — ' + penSt.days + ' TAGE INAKTIV</div>';
  h += '<div class="scroll"><div class="pad">';

  // SYSTEM CONTROLS
  h += '<div class="sec-title" style="border-top:none;margin-top:0">SYSTEM</div>';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px">';
  h += '<button class="btn sm" onclick="exportData()">EXPORT</button>';
  h += '<button class="btn sm" onclick="document.getElementById(\'imp_file\').click()">IMPORT</button>';
  h += '<button class="btn sm ' + (showInstall?'amber':'ghost') + '" onclick="installOrGuide()">' + (showInstall?'INSTALLIEREN':'APP INSTALL') + '</button>';
  var p = state.pause||{};
  h += '<button class="btn sm ' + (p.active?'amber':'') + '" onclick="openModal(\'pause\')">' + (p.active?'PAUSE AKTIV':'PAUSE') + '</button>';
  h += '</div>';
  h += '<input type="file" id="imp_file" accept=".json" style="display:none" onchange="handleImport(event)">';
  h += '<div id="install-guide" style="display:none;background:var(--gfaint);border:1px solid var(--amber);padding:8px 10px;margin-bottom:8px;font-size:9px;color:var(--amber)">EDGE: Menü (···) → Apps → Diese Seite als App installieren</div>';

  // CHECK-INS
  h += '<div class="sec-title">KÖRPER-DATEN (' + state.checkins.length + ')</div>';
  state.checkins.slice().reverse().forEach(function(c) {
    var isAnchor = state.checkins.indexOf(c) === 0;
    h += '<div class="data-card' + (isAnchor?' card-amber':'') + '">';
    h += '<div class="data-date">' + c.date + (isAnchor?' [ANKER]':'') + '</div>';
    h += '<div class="data-grid">';
    [['Gewicht',c.weight,'kg'],['Viszeralfett',c.visceral,''],['Muskelmasse',c.muscle,'kg'],
     ['KFA',c.fat,'%'],['Blutdruck',c.bp,''],['Schlaf',c.sleep,'h'],
     ['Score',c.sleepScore,''],['WHR',c.whr,''],
     ['👟 Schritte',c.schritte ? parseInt(c.schritte).toLocaleString('de-DE') : null,'']]
    .concat(MEASUREMENTS.map(function(m){return [m.name,c[m.id],'cm'];}))
    .filter(function(x){return x[1];})
    .forEach(function(x){ h += '<div class="dl">' + x[0] + ':</div><div class="dv">' + x[1] + x[2] + '</div>'; });
    h += '</div>';
    if (c.note) h += '<div class="dn">' + c.note + '</div>';
    if (!isAnchor) {
      var realIdx = state.checkins.indexOf(c);
      h += '<button class="btn sm red" style="margin-top:4px;padding:4px" onclick="deleteCheckin(' + realIdx + ')">LÖSCHEN</button>';
    }
    h += '</div>';
  });

  // TRAININGS
  if (state.trainings.length) {
    h += '<div class="sec-title">TRAINING (' + state.trainings.length + ')</div>';
    state.trainings.slice().reverse().forEach(function(t) {
      var realIdx = state.trainings.indexOf(t);
      if (t.type==='egym') {
        h += '<div class="data-card" style="border-color:#224422">';
        h += '<div class="data-date" style="color:var(--glow)">EGYM · ' + t.date + ' · Score ' + t.score + ' · ' + t.sessionXP + ' XP · ' + t.modeId + '</div>';
        h += '<div class="data-grid">';
        if (t.exData) {
          EGYM_EX.forEach(function(ex) {
            var sets=t.exData[ex.id]||[];
            if(sets.length) h += '<div class="dl">' + ex.name + ':</div><div class="dv">' + sets.map(function(s,i){return 'S'+(i+1)+':'+s.kg+'x'+s.wdh;}).join(' ') + '</div>';
          });
        }
        h += '</div><button class="btn sm red" style="margin-top:4px;padding:4px" onclick="deleteTraining(' + realIdx + ')">LÖSCHEN</button></div>';
      } else if (t.type==='seil') {
        h += '<div class="data-card" style="border-color:#224466"><div class="data-date" style="color:var(--blue)">SEIL · ' + t.date + ' · ' + t.sessionXP + ' XP</div>';
        h += '<div class="data-grid"><div class="dl">Dauer:</div><div class="dv">' + formatMinSek(t.dauer||0) + 'min</div><div class="dl">RPM:</div><div class="dv">' + (t.rpm||'?') + '</div><div class="dl">Runden:</div><div class="dv">' + (t.runden||'?') + '</div></div>';
        h += '<button class="btn sm red" style="margin-top:4px;padding:4px" onclick="deleteTraining(' + realIdx + ')">LÖSCHEN</button></div>';
      } else if (t.type==='bike') {
        h += '<div class="data-card" style="border-color:var(--cyan)"><div class="data-date" style="color:var(--cyan)">RAD · ' + t.date + ' · ' + t.sessionXP + ' XP</div>';
        h += '<div class="data-grid"><div class="dl">Distanz:</div><div class="dv">' + (t.distanz||'?') + 'km</div><div class="dl">Dauer:</div><div class="dv">' + formatMinSek(t.dauer||0) + 'min</div><div class="dl">Ø Speed:</div><div class="dv">' + (t.avgSpeed||'?') + 'km/h</div>' + (t.maxSpeed?'<div class="dl">Max:</div><div class="dv">'+t.maxSpeed+'km/h</div>':'') + '</div>';
        h += '<button class="btn sm red" style="margin-top:4px;padding:4px" onclick="deleteTraining(' + realIdx + ')">LÖSCHEN</button></div>';
      } else if (t.type==='ergo') {
        h += '<div class="data-card" style="border-color:#336633"><div class="data-date" style="color:#66cc66">ERGO · ' + t.date + ' · ' + t.sessionXP + ' XP</div>';
        h += '<div class="data-grid"><div class="dl">Dauer:</div><div class="dv">' + formatMinSek(t.dauer||0) + 'min</div>' + (t.distanz?'<div class="dl">Distanz:</div><div class="dv">'+t.distanz+'km</div>':'') + (t.avgSpeed?'<div class="dl">Ø Speed:</div><div class="dv">'+t.avgSpeed+'km/h</div>':'') + '</div>';
        h += '<button class="btn sm red" style="margin-top:4px;padding:4px" onclick="deleteTraining(' + realIdx + ')">LÖSCHEN</button></div>';
      }
    });
  }

  h += '<div class="sec-title" style="color:var(--red)">DANGER ZONE</div>';
  h += '<button class="btn red" onclick="resetAll()">RESET — ALLE DATEN LÖSCHEN</button>';
  h += '<div class="page-footer">V6.0.0 · ' + new Date(document.lastModified).toLocaleDateString('de-DE') + ' ' + new Date(document.lastModified).toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'}) + '</div>';
  h += '</div></div>';
  root.innerHTML = h;
  if (modal) renderModal();
}

function openModal(m) { modal=m; render(); }
function closeModal() { modal=null; var m=document.getElementById('pp-modal'); if(m) m.remove(); }

function renderModal() {
  var old=document.getElementById('pp-modal'); if(old) old.remove();
  if(!modal) return;
  var h='<div class="modal-overlay" id="pp-modal"><div class="modal">';
  if (modal==='pause') {
    var p=state.pause||{};
    h+='<div class="modal-title">PAUSE</div>';
    if(p.active){
      h+='<div style="font-size:10px;color:var(--amber);margin-bottom:8px">AKTIV SEIT '+p.startDate+' — '+p.reason+'</div>';
      h+='<button class="btn" onclick="endPause();closeModal();render()">PAUSE BEENDEN</button>';
    } else {
      h+='<div class="f-wrap"><div class="f-lbl">GRUND</div><input class="f-in" id="pause_reason" placeholder="Krankheit / Urlaub ..."></div>';
      h+='<div class="mactions"><button class="btn amber" onclick="doStartPause()">PAUSE STARTEN</button><button class="btn red" onclick="closeModal()">ABBRUCH</button></div>';
    }
  }
  h+='</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function doStartPause() {
  var r=(document.getElementById('pause_reason')||{}).value||'';
  startPause(r); closeModal(); toast('Pause gestartet','amber'); render();
}

function deleteCheckin(idx) {
  if(idx===0){toast('Anker kann nicht gelöscht werden','err');return;}
  if(!confirm('Check-in löschen?'))return;
  var c = state.checkins[idx];
  if (c && c.sleepXP) state.globalXP = Math.max(0, (state.globalXP||0) - c.sleepXP);
  state.checkins.splice(idx,1);
  recalcStats(); saveState(); toast('Gelöscht'); render();
}

function deleteTraining(idx) {
  if(!confirm('Training löschen?'))return;
  var t = state.trainings[idx];
  if (!t) return;
  // XP REVERSAL — subtract exact XP that was applied
  var xpToRemove = {total: t.sessionXP||0, statXP: t.statXP||{}};
  subtractXP(xpToRemove);
  addEv('system', 'Training gelöscht: ' + t.type + ' ' + t.date + ' -' + (t.sessionXP||0) + ' XP');
  state.trainings.splice(idx,1);
  recalcStats(); saveState(); toast('Gelöscht'); render();
}

function handleImport(e) {
  var file=e.target.files[0]; if(!file) return;
  importData(file, function(ok){ if(ok){toast('Import OK');render();}else toast('Import fehlgeschlagen','err'); });
}

function resetAll() {
  if(!confirm('ALLES ZURÜCKSETZEN?'))return;
  localStorage.removeItem(STATE_KEY);
  localStorage.removeItem('panzer_bkur_start');
  localStorage.removeItem(DAILY_OPT_KEY);
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  saveState(); toast('Reset','err'); render();
}

function installOrGuide() {
  if(installPrompt){ installPrompt.prompt(); installPrompt.userChoice.then(function(){installPrompt=null;showInstall=false;render();}); }
  else { var g=document.getElementById('install-guide'); if(g) g.style.display=g.style.display==='none'?'block':'none'; }
}

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); installPrompt=e; showInstall=true; render();
});

render();


</script>
</body>
</html>
