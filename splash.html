<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WASTELAND PANZER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="themes.js"></script>
<script>
(function(){
  try {
    var id = localStorage.getItem('wp_theme') || 'amber';
    var theme = typeof WP_THEMES !== 'undefined' ? WP_THEMES.find(function(t){return t.id===id;}) : null;
    if (theme && theme.vars) {
      var root = document.documentElement;
      ['--amber','--adim','--afaint','--bg0','--glow-hi','--glow-lo','--text','--tb'].forEach(function(k){
        if (theme.vars[k]) root.style.setProperty(k, theme.vars[k]);
      });
    }
  } catch(e) {}
})();
</script>
<style>
  :root { --amber:#ffaa00; --adim:#664400; --afaint:#1a0e00; --bg0:#050505; --glow-hi:rgba(255,170,0,0.6); --glow-lo:rgba(255,170,0,0.4); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; background:var(--bg0); color:var(--amber); font-family:'Share Tech Mono',monospace; overflow:hidden; }
  body::after { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px); pointer-events:none; z-index:100; }

  @keyframes flicker { 0%,100%{opacity:1} 93%{opacity:0.45} 94%{opacity:1} 97%{opacity:0.8} 98%{opacity:1} }
  @keyframes glow-pulse { 0%,100%{text-shadow:0 0 10px var(--glow-hi),0 0 30px var(--glow-lo)} 50%{text-shadow:0 0 25px var(--amber),0 0 60px var(--glow-hi)} }
  @keyframes scanDown { from{top:-4px} to{top:100%} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  @keyframes imgReveal { from{opacity:0;transform:scale(1.05)} to{opacity:1;transform:scale(1)} }
  @keyframes glitch { 0%{transform:translate(0)} 20%{transform:translate(-3px,1px)} 50%{transform:translate(3px,-1px)} 80%{transform:translate(-1px,2px)} 100%{transform:translate(0)} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeOut { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(-6px)} }

  .scan-line { position:fixed; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--amber),transparent); opacity:0.5; animation:scanDown 2.8s linear infinite; z-index:99; }

  #splash { position:fixed; inset:0; display:flex; flex-direction:column; animation:flicker 6s infinite; }

  .hero { position:relative; flex:0 0 62%; overflow:hidden; }
  .hero img { width:100%; height:100%; object-fit:cover; object-position:center 30%; animation:imgReveal 1.2s ease forwards; filter:sepia(0.25) saturate(1.3) brightness(0.8); }
  .hero::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom,rgba(0,0,0,0.05) 0%,rgba(0,0,0,0) 45%,rgba(0,0,0,0.8) 82%,var(--bg0) 100%); }
  .hero-title { position:absolute; bottom:10px; left:0; right:0; text-align:center; z-index:2; animation:fadeIn 1s ease 0.4s both; }
  .hero-title .main { font-family:'Orbitron',sans-serif; font-size:25px; font-weight:900; letter-spacing:5px; color:var(--amber); animation:glow-pulse 2.5s ease-in-out infinite; }
  .hero-title .sub { font-size:8px; letter-spacing:4px; color:var(--adim); margin-top:3px; }

  .boot { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:10px 20px 16px; background:var(--bg0); }

  /* S.P.E.C.I.A.L. Zeile — erscheint und verschwindet */
  .stat-line {
    font-size:12px; letter-spacing:2px; color:var(--amber);
    text-align:center; height:22px; margin-bottom:6px;
    opacity:0;
  }
  .stat-line.show { animation:fadeIn 0.3s ease forwards; }
  .stat-line.hide { animation:fadeOut 0.3s ease forwards; }
  .stat-line .dots { color:var(--adim); }
  .stat-line .loaded { color:#44ff88; }

  .special-done {
    font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:3px;
    color:var(--amber); text-align:center; margin-bottom:10px;
    opacity:0;
  }

  .progress-wrap { width:100%; max-width:300px; }
  .progress-label { font-size:8px; letter-spacing:2px; color:var(--adim); display:flex; justify-content:space-between; margin-bottom:5px; }
  .progress-bar { height:3px; background:var(--afaint); border:1px solid var(--adim); overflow:hidden; margin-bottom:10px; }
  .progress-fill { height:100%; width:0; background:linear-gradient(90deg,var(--adim),var(--amber)); box-shadow:0 0 8px var(--glow-hi); transition:width 0.35s ease; }

  .enter-hint { text-align:center; font-size:9px; letter-spacing:3px; color:var(--adim); opacity:0; }
  .enter-hint.show { animation:blink 1.5s step-end infinite; }
</style>
</head>

      <div class="main" id="main-title">WASTELAND PANZER</div>
      <div class="sub">GOMMERN · SURVIVAL PROTOCOL · OS v5.6</div>
    </div>
  </div>
  <div class="boot">
    <div class="stat-line" id="stat-line"><span id="stat-name"></span><span class="dots" id="stat-dots"></span><span class="loaded" id="stat-loaded"></span></div>
    <div class="special-done" id="special-done">S.P.E.C.I.A.L. GELADEN</div>
    <div class="progress-wrap">
      <div class="progress-label"><span id="phase-label">INITIALISIERE</span><span id="pct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="pfill"></div></div>
    </div>
    <div class="enter-hint" id="hint">// TIPPEN ZUM STARTEN</div>
  </div>
</div>

<script>
const VERSION = '5.6';
document.querySelector('.sub').textContent = 'GOMMERN · SURVIVAL PROTOCOL · OS v' + VERSION;

const stats = ['STRENGTH','PERCEPTION','ENDURANCE','CHARISMA','INTELLIGENCE','AGILITY','LAUFEN'];
const statLine = document.getElementById('stat-line');
const statName = document.getElementById('stat-name');
const statDots = document.getElementById('stat-dots');
const statLoaded = document.getElementById('stat-loaded');
const specialDone = document.getElementById('special-done');
const fill = document.getElementById('pfill');
const pct = document.getElementById('pct');
const phase = document.getElementById('phase-label');
const hint = document.getElementById('hint');
const title = document.getElementById('main-title');
let ready = false;

function setProgress(p, label) {
  fill.style.width = p + '%';
  pct.textContent = p + '%';
  if (label) phase.textContent = label;
}

function showStat(name, onDone) {
  // Einblenden
  statName.textContent = name;
  statDots.textContent = '......';
  statLoaded.textContent = '';
  statLine.className = 'stat-line show';

  // Nach kurzer Pause "GELADEN" zeigen
  setTimeout(function() {
    statLoaded.textContent = ' GELADEN';
    // Dann ausblenden
    setTimeout(function() {
      statLine.className = 'stat-line hide';
      setTimeout(function() {
        statLine.className = 'stat-line';
        onDone();
      }, 320);
    }, 350);
  }, 420);
}

// Sequenz starten
setTimeout(function() {
  setProgress(5, 'INITIALISIERE S.P.E.C.I.A.L.');
  let i = 0;
  function nextStat() {
    if (i >= stats.length) {
      // Alle durch — "S.P.E.C.I.A.L. GELADEN" zeigen
      specialDone.style.animation = 'fadeIn 0.4s ease forwards';
      title.style.animation = 'glitch 0.3s ease';
      setTimeout(function(){ title.style.animation = 'glow-pulse 2.5s ease-in-out infinite'; }, 350);
      setProgress(55, 'LADE RESSOURCEN');
      // Ressourcen + Radio
      setTimeout(function(){
        specialDone.style.animation = 'fadeOut 0.3s ease forwards';
        setProgress(80, 'LADE RESSOURCEN');
      }, 600);
      setTimeout(function(){ setProgress(90, 'SYNC WASTELAND RADIO'); }, 1000);
      setTimeout(function(){
        setProgress(100, 'ALLE SYSTEME GRÜN');
        hint.style.opacity = '1';
        hint.classList.add('show');
        ready = true;
      }, 1500);
      return;
    }
    const p = Math.round(5 + (i+1)/stats.length * 50);
    setProgress(p);
    showStat(stats[i], function() { i++; nextStat(); });
  }
  nextStat();
}, 600);

function goToApp() {
  if (!ready) return;
  ready = false;
  document.getElementById('splash').style.transition = 'opacity 0.5s';
  document.getElementById('splash').style.opacity = '0';
  setTimeout(function(){ window.location.href = 'index.html'; }, 500);
}

document.addEventListener('click', function(){ if (ready) goToApp(); });
</script>
