<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WASTELAND PANZER">
<title>ÜBERSICHT — WASTELAND PANZER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<style>/* injected */</style>
</head>
<body>
<div id="root"></div>
<script src="themes.js"></script>
<script src="core.js"></script>
<script>

// ---- INDEX PAGE ----
let modal = null;
let installPrompt = null;

function render() {
  const root = document.getElementById('root');
  const latest = state.checkins[state.checkins.length-1]||{} || {};
  const penSt = checkPenalty();
  const ksmSt = getKsmState();
  const ksmTaken = state.ksm.lastTakenDate === today();
  const todaySupps = state.supplements[today()] || {};

  // Supp progress count (kern only for main display)
  const kernTaken = KERN_SUPPS.filter(s => todaySupps[s.id]).length;
  const kernTotal = KERN_SUPPS.length;
  const kernPct = Math.round((kernTaken/kernTotal)*100);

  let h = renderHeader('index.html');

  if (penSt.active) {
    h += `<div class="penalty-bar">⚠ PANZER ROSTET — ${penSt.days} TAGE INAKTIV — SOFORT HANDELN</div>`;
  }

  h += '<div class="scroll"><div class="pad">';

  // SUPP MINI PROGRESS
  h += `<div class="supp-progress">
    <div class="supp-progress-lbl">☰ CHEMS</div>
    <div class="supp-progress-track">
      <div class="supp-progress-fill${kernTaken===kernTotal?' done':''}" style="width:${kernPct}%"></div>
    </div>
    <div class="supp-progress-num" style="color:${kernTaken===kernTotal?'var(--amber)':'var(--glow)'}">${kernTaken}/${kernTotal}</div>
  </div>`;

  // RADAR
  h += '<div class="radar-wrap"><div class="radar-title">S.P.E.C.I.A.L. RADAR</div>';
  h += '<canvas id="radar" width="260" height="200"></canvas></div>';

  // STAT BARS
  h += '<div class="stat-section">';
  h += '<div class="sec-title">S.P.E.C.I.A.L. — OBJEKTIVE WERTE</div>';
  KEYS.forEach(k => {
    const def = STAT_DEFS[k];
    const val = state.stats[k];
    const trainXP = state.statTrainXP[k]||0;
    const isMst = val >= 10;
    const mstLvl = (state.masteryLevel||{})[k]||0;
    const mstXP = (state.mastery||{})[k]||0;
    const thresh = statXpThresh(val);
    const trainPct = isMst
      ? Math.min(100, Math.round((mstXP%500)/500*100))
      : Math.min(100, Math.round((trainXP/thresh)*100));
    const dispNum = isMst ? `10${mstLvl>0?'+'+mstLvl:'★'}` : `${val}/10`;

    h += `<div class="stat-block">
      <div class="stat-row">
        <div class="stat-lbl">${def.short}:</div>
        <div class="stat-num" style="${isMst?'color:var(--amber);':''}">${dispNum}</div>
        <div class="stat-bar-w">
          <div class="stat-bar-f${isMst?' mst':''}" style="width:${isMst?100:val*10}%"></div>
          ${!isMst?[2,4,6,8].map(p=>`<div class="stat-bar-pip" style="left:${p*10}%"></div>`).join(''):''}
        </div>
        <div class="stat-basis">${def.basis}</div>
      </div>
      <div class="trn-row">
        <div class="trn-lbl">${isMst?'OVR:':'TRN:'}</div>
        <div class="trn-pct">${trainPct}%</div>
        <div class="trn-bar-w"><div class="trn-bar-f" style="width:${trainPct}%"></div></div>
        <div class="trn-xpnum">${Math.round(isMst?mstXP%500:trainXP)}/${isMst?500:thresh}</div>
      </div>
    </div>`;
  });
  h += '</div>';

  // TRENDS
  const trendFields = [
    {id:'weight',  lbl:'GEWICHT',      unit:'kg', dec:1, lower:true,  win:7,  thr:0.3},
    {id:'visceral',lbl:'VISZERALFETT', unit:'',   dec:1, lower:true,  win:7,  thr:0.3},
    {id:'muscle',  lbl:'MUSKELMASSE',  unit:'kg', dec:1, lower:false, win:14, thr:0.2},
    {id:'fat',     lbl:'KFA',          unit:'%',  dec:1, lower:true,  win:7,  thr:0.3},
  ];
  // Rollierendes Mittel: juengstes Fenster (win Tage) vs. vorhergehendes gleich langes Fenster.
  // Fallback auf erster-vs-letzter Wert, wenn ein Fenster leer ist (duenn gesaete Daten).
  function rollingTrend(field, win) {
    const dv = (state.checkins||[])
      .filter(c => c && c[field] && parseFloat(c[field])>0 && parseDE(c.date))
      .map(c => ({d: parseDE(c.date), v: parseFloat(c[field])}))
      .sort((a,b) => a.d - b.d);
    if (!dv.length) return null;
    const latest = dv[dv.length-1].v;
    const ref = new Date(); ref.setHours(0,0,0,0);
    const startRecent = new Date(ref); startRecent.setDate(startRecent.getDate() - (win-1));
    const startPrev   = new Date(ref); startPrev.setDate(startPrev.getDate() - (2*win-1));
    const recent = dv.filter(x => x.d >= startRecent);
    const prev   = dv.filter(x => x.d >= startPrev && x.d < startRecent);
    const avg = a => a.reduce((s,x)=>s+x.v,0)/a.length;
    if (recent.length && prev.length) return {latest, diff: avg(recent)-avg(prev), mode: win+'T'};
    return {latest, diff: latest - dv[0].v, mode: 'ges'};
  }
  h += '<div class="sec-title">TREND-MONITOR</div>';
  if (state.checkins.length < 2) {
    h += '<div style="font-size:9px;color:var(--gdim)">Mind. 2 Check-ins für Trends.</div>';
  } else {
    h += '<div class="trend-grid">';
    trendFields.forEach(tf => {
      const rt = rollingTrend(tf.id, tf.win);
      if (!rt) {
        h += `<div class="trend-card"><div class="trend-lbl">${tf.lbl}</div><div style="font-size:8px;color:var(--gdim)">Keine Daten</div></div>`;
        return;
      }
      const lv = rt.latest;          // Headline: echter letzter Messwert
      const diff = rt.diff;          // Trend: rollierender Fenster-Vergleich (bzw. Fallback)
      const isFlat = Math.abs(diff) < tf.thr;
      const isPos = tf.lower ? diff<0 : diff>0;
      const arrow = isFlat?'→':diff<0?'↓':'↑';
      const ac = isFlat?'flat':isPos?'down':'up';
      const sc = isFlat?'flat':isPos?'pos':'neg';
      const st = isFlat ? ('stabil ·'+rt.mode) : (isPos?'▼ ':'▲ ')+Math.abs(diff).toFixed(tf.dec)+tf.unit+' ·'+rt.mode;
      h += `<div class="trend-card">
        <div class="trend-lbl">${tf.lbl}</div>
        <div class="trend-val">${lv.toFixed(tf.dec)}${tf.unit}<span class="trend-${ac}"> ${arrow}</span></div>
        <div class="trend-sub-${sc}">${st}</div>
        <canvas id="sp_${tf.id}" width="110" height="24" style="margin-top:4px"></canvas>
      </div>`;
    });
    h += '</div>';
  }

  // BODY DATA
  h += '<div class="sec-title">KÖRPERDATEN</div>';
  h += '<div class="measure-grid">';
  MEASUREMENTS.forEach(m => {
    const val = latest[m.id];
    h += `<div class="measure-cell">
      <div class="measure-lbl">${m.name.toUpperCase()}</div>
      <div class="measure-val${val?'':' empty'}">${val||'--'}</div>
    </div>`;
  });
  const whrVal = latest.whr || (latest.taille&&latest.huefte&&parseFloat(latest.taille)>0
    ? (parseFloat(latest.taille)/parseFloat(latest.huefte)).toFixed(3) : null);
  h += `<div class="measure-cell" style="grid-column:1/-1;border-color:var(--amber);background:#0a0800">
    <div class="measure-lbl" style="color:var(--amber)">WAIST-TO-HIP RATIO</div>
    <div class="measure-val" style="color:var(--amber)">${whrVal||'-- (Taille+Hüfte eingeben)'}</div>
  </div></div>`;

  h += `<button class="btn" onclick="openModal('checkin')">⊙ KÖRPER CHECK-IN</button>`;
  h += `<button class="btn amber" onclick="openModal('pause')">⏸ PAUSE STATUS</button>`;
  h += `<button class="btn blue" onclick="openModal('schritte')">👟 SCHRITTE EINTRAGEN</button>`;
  h += '<div class="page-footer">V5.6 · ' + new Date(document.lastModified).toLocaleDateString('de-DE') + ' ' + new Date(document.lastModified).toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'}) + '</div>';
  h += '</div></div>';

  root.innerHTML = h;

  requestAnimationFrame(() => {
    const c = document.getElementById('radar');
    if (c) drawRadar(c);
    [{id:'weight',win:7,lower:true},{id:'visceral',win:7,lower:true},{id:'muscle',win:14,lower:false},{id:'fat',win:7,lower:true}].forEach(tf => {
      const c2 = document.getElementById('sp_'+tf.id);
      if (!c2) return;
      const vals = state.checkins.filter(x=>x[tf.id]&&parseFloat(x[tf.id])>0).map(x=>parseFloat(x[tf.id]));
      if (vals.length>=2) {
        const rt = rollingTrend(tf.id, tf.win);
        const good = rt ? (tf.lower ? rt.diff<0 : rt.diff>0) : false;
        drawSparkline(c2, vals, good);
      }
    });
  });

  if (modal) renderModal();
}

// ---- MODAL ----
function openModal(m) { modal=m; render(); }
function closeModal() {
  modal=null;
  const m=document.getElementById('pp-modal');
  if(m) m.remove();
}

function renderModal() {
  const old = document.getElementById('pp-modal');
  if(old) old.remove();
  if (!modal) return;
  let h = '<div class="modal-overlay" id="pp-modal"><div class="modal">';

  if (modal==='checkin') {
    h += '<div class="modal-title">⊙ KÖRPER CHECK-IN</div>';
    h += '<div class="modal-sub">XIAOMI S400 · AMAZFIT T-REX 3 · BLUTDRUCKGERÄT · MASSBAND</div>';
    h += '<div class="modal-sec">// KÖRPERDATEN</div>';
    h += '<div class="f-g2">';
    [['weight','Gewicht (kg)','107.4'],['visceral','Viszeralfett','13.0'],
     ['muscle','Muskelmasse (kg)','73.1'],['fat','KFA (%)','27.8']].forEach(([id,lbl,ph]) => {
      h += `<div class="f-wrap"><div class="f-lbl">${lbl}</div>
        <input class="f-in" id="ci_${id}" placeholder="${ph}" inputmode="decimal">
        <div class="f-err" id="ci_${id}_err"></div></div>`;
    });
    h += '</div><div class="f-g2">';
    [['bp','Blutdruck','128/83'],['sleep','Schlaf (h)','4.5'],
     ['sleepScore','Schlaf-Score','58'],['note','Notiz','']].forEach(([id,lbl,ph]) => {
      h += `<div class="f-wrap"><div class="f-lbl">${lbl}</div>
        <input class="f-in" id="ci_${id}" placeholder="${ph}" inputmode="${id==='bp'||id==='note'?'text':'decimal'}"></div>`;
    });
    h += '</div>';
    h += '<div class="modal-sec">// KÖRPERMASSE (cm) — optional</div>';
    for (let i=0;i<MEASUREMENTS.length;i+=2) {
      const ma=MEASUREMENTS[i], mb=MEASUREMENTS[i+1];
      h += `<div class="f-g2">
        <div class="f-wrap"><div class="f-lbl">${ma.name} (cm)</div><input class="f-in" id="ci_${ma.id}" placeholder="--" inputmode="decimal"></div>`;
      if(mb) h += `<div class="f-wrap"><div class="f-lbl">${mb.name} (cm)</div><input class="f-in" id="ci_${mb.id}" placeholder="--" inputmode="decimal"></div>`;
      h += '</div>';
    }
    h += '<div style="background:var(--g0);border:1px solid var(--amber);padding:5px 8px;margin-top:4px;font-size:8px;color:var(--amber)">WHR = Taille ÷ Hüfte — wird automatisch berechnet.</div>';
    h += '<div class="mactions"><button class="btn" onclick="saveCheckin()">SPEICHERN</button><button class="btn red" onclick="closeModal()">ABBRUCH</button></div>';
  }

  if (modal==='schritte') {
    // Letzte 7 Tage mit Schritten anzeigen und editierbar machen
    var last7 = [];
    for (var di=0; di<7; di++) {
      var dd = new Date();
      dd.setDate(dd.getDate()-di);
      var ds = dd.toLocaleDateString('de-DE');
      var ci = state.checkins.findLast(function(c){return c&&c.date===ds;});
      last7.push({date:ds, schritte:(ci&&ci.schritte)||''});
    }
    h += '<div class="modal-title">👟 SCHRITTE</div>';
    h += '<div class="modal-sub">LETZTE 7 TAGE — NACHTRAGEN MÖGLICH</div>';
    last7.forEach(function(d,i) {
      h += '<div class="f-g2" style="margin-bottom:4px">';
      h += '<div style="font-size:9px;color:var(--gdim);padding:8px 0">' + d.date + '</div>';
      h += '<input class="f-in" id="schr_' + i + '" data-date="' + d.date + '" placeholder="0" inputmode="decimal" value="' + d.schritte + '">';
      h += '</div>';
    });
    h += '<div class="mactions"><button class="btn blue" onclick="saveSchritte()">SPEICHERN</button><button class="btn red" onclick="closeModal()">ABBRUCH</button></div>';
  }

  if (modal==='pause') {
    const p = state.pause;
    h += '<div class="modal-title">⏸ PAUSE</div>';
    if (p.active) {
      h += `<div style="font-size:10px;color:var(--amber);margin-bottom:8px;">AKTIV SEIT ${p.startDate} — ${p.reason}</div>`;
      h += '<button class="btn" onclick="endPause();closeModal();render()">PAUSE BEENDEN</button>';
    } else {
      h += '<div class="f-wrap"><div class="f-lbl">GRUND</div>';
      h += '<input class="f-in" id="pause_reason" placeholder="Krankheit / Urlaub / ..."></div>';
      h += '<div class="mactions"><button class="btn amber" onclick="startPauseModal()">PAUSE STARTEN</button><button class="btn red" onclick="closeModal()">ABBRUCH</button></div>';
    }
  }

  h += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function startPauseModal() {
  const reason = (document.getElementById('pause_reason')||{}).value||'';
  startPause(reason);
  closeModal();
  toast('Pause gestartet', 'amber');
  render();
}

function saveSchritte() {
  for (var i=0; i<7; i++) {
    var el = document.getElementById('schr_'+i);
    if (!el) continue;
    var date = el.getAttribute('data-date');
    var val = el.value.trim();
    if (!val) continue;
    // Finde oder erstelle Check-in für dieses Datum
    var ci = state.checkins.findLast(function(c){return c&&c.date===date;});
    if (ci) {
      ci.schritte = val;
    } else {
      state.checkins.push({date:date, schritte:val, weight:'', visceral:'', muscle:'', fat:'', bp:'', sleep:'', sleepScore:'', whr:'', note:''});
      state.checkins.sort(function(a,b){
        var pa=a.date.split('.'), pb=b.date.split('.');
        return new Date(pa[2],pa[1]-1,pa[0]) - new Date(pb[2],pb[1]-1,pb[0]);
      });
    }
  }
  recalcStats(); saveState();
  closeModal(); toast('Schritte gespeichert'); render();
}

function saveCheckin() {
  const f = {};
  ['weight','visceral','muscle','fat','bp','sleep','sleepScore','note'].forEach(k => {
    f[k] = (document.getElementById('ci_'+k)||{}).value?.trim()||'';
  });
  MEASUREMENTS.forEach(m => {
    f[m.id] = (document.getElementById('ci_'+m.id)||{}).value?.trim()||'';
  });

  // Validate
  const {valid, errors} = validateCheckin(f);
  ['weight','visceral','muscle','fat'].forEach(k => {
    const el = document.getElementById('ci_'+k);
    const errEl = document.getElementById('ci_'+k+'_err');
    if (el) el.classList.toggle('err', !!errors[k]);
    if (errEl) errEl.textContent = errors[k]||'';
  });
  if (!valid) { toast('Werte prüfen', 'err'); return; }

  processCheckin(f);
  closeModal();
  toast('✓ Check-in gespeichert');
  render();
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installPrompt = e;
});

render();


</script>
</body>
</html>
