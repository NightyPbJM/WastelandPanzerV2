<script>
// ============================================================
// WASTELAND PANZER v12 — CORE
// ============================================================
'use strict';

const VET_YEAR = 1985;
const VET_F = (new Date().getFullYear() - VET_YEAR) / 100 + 1;

const STAT_DEFS = {
  S:{name:"STRENGTH",   short:"STR", basis:"EGYM Score/KG",    anchor:true,  mt:"IRON TITAN",        mr:"Score/KG >= 60"},
  P:{name:"PERCEPTION", short:"PER", basis:"Schlaf-Score Ø",   anchor:false, mt:"GHOST PROTOCOL",   mr:"Ø Score >= 70"},
  E:{name:"ENDURANCE",  short:"END", basis:"Ausdauer-Score",   anchor:true,  mt:"MARATHON MACHINE", mr:"Ausdauer >= 50"},
  C:{name:"CHARISMA",   short:"CHA", basis:"Supplement-Streak",anchor:false, mt:"DISCIPLINE ENGINE",mr:"Alle Supps 30d"},
  I:{name:"INTELLIGENCE",short:"INT",basis:"Viszeralfett inv.", anchor:false, mt:"SYSTEM ANALYST",   mr:"VF <= 8"},
  A:{name:"AGILITY",    short:"AGI", basis:"WHR + KFA",        anchor:false, mt:"SHADOW RUNNER",    mr:"WHR<=0.87+KFA<=22%"},
  L:{name:"LUCK",       short:"LCK", basis:"Manuell",          anchor:false, mt:"WASTELAND VETERAN",mr:"Manuell"}
};
const KEYS = ["S","P","E","C","I","A","L"];

const EGYM = [
  {id:"beinstrecker",  name:"Beinstrecker",  stat:"A"},
  {id:"schulterpresse",name:"Schulterpresse", stat:"S"},
  {id:"latzug",        name:"Latzug",         stat:"S"},
  {id:"beinbeuger",    name:"Beinbeuger",     stat:"A"},
  {id:"rueckentrainer",name:"Rückentrainer",  stat:"E"},
  {id:"bauchtrainer",  name:"Bauchtrainer",   stat:"E"},
  {id:"ruderzug",      name:"Ruderzug",       stat:"S"},
  {id:"brustpresse",   name:"Brustpresse",    stat:"S"}
];

const EGYM_MODES = [
  {id:"regulaer",    name:"Regulär",       factor:1.0},
  {id:"explosiv",    name:"Explosiv",      factor:1.2},
  {id:"negativ",     name:"Negativ Kraft", factor:1.3},
  {id:"isokinetisch",name:"Isokinetisch",  factor:1.4},
  {id:"adaptiv",     name:"Adaptiv",       factor:1.5}
];

const SUPPS = [
  {id:"kreatin",  name:"KREATIN", icon:"⚗️"},
  {id:"zink",     name:"ZINK",    icon:"🔬"},
  {id:"magnesium",name:"MAGNESI.",icon:"💊"},
  {id:"omega3",   name:"OMEGA-3", icon:"🐟"},
  {id:"d3k2",     name:"D3/K2",   icon:"☀️"}
];

const MEAS = [
  {id:"kopf",    name:"Kopf"},    {id:"hals",   name:"Hals"},
  {id:"schulter",name:"Schulter"},{id:"brust",  name:"Brust"},
  {id:"taille",  name:"Taille"},  {id:"huefte", name:"Hüfte"},
  {id:"lArm",    name:"L.Arm"},   {id:"rArm",   name:"R.Arm"},
  {id:"lOber",   name:"L.Ober"},  {id:"rOber",  name:"R.Ober"},
  {id:"lWade",   name:"L.Wade"},  {id:"rWade",  name:"R.Wade"}
];

const QUESTS = [
  {id:"main", type:"HAUPTQUEST",  badge:"active",    title:"Abriss des Dachschadens",   req:"Visceral Fat < 10", locked:false},
  {id:"liver",type:"DAUERQUEST",  badge:"dauerquest", title:"Leber-Retter",               req:"Permanent aktiv",   locked:false},
  {id:"sve",  type:"BONUS-QUEST", badge:"locked",    title:"Handball Gommern (Legende)",req:"Visceral Fat < 10", locked:true,
   unlockAt: v => v < 10}
];

const KSM_ON = 56, KSM_OFF = 14;
const STORE_KEY = "ppv12";

// ============================================================
// DEFAULT STATE
// ============================================================
const DEFAULT_STATE = {
  stats: {S:1,P:1,E:1,C:1,I:1,A:1,L:5},
  checkins: [{date:"10.05.2026",weight:"107.4",visceral:"13.0",muscle:"73.1",fat:"27.8",bp:"128/83",sleep:"4.5",sleepScore:"58",whr:"",note:"ANKER"}],
  trainings: [],
  supplements: {},
  suppStreaks: {},
  globalXP: 0,
  statTrainXP: {S:0,P:0,E:0,C:0,I:0,A:0,L:0},
  mastery: {},
  masteryLevel: {},
  masteryTitles: {},
  lastPenaltyDate: "",
  pause: {active:false, reason:"", since:""},
  ksm: {cycleStart:null, lastTakenDate:""},
  events: [
    {type:"system", date:"17.05.2026", msg:"WASTELAND PANZER v12 initialisiert."},
    {type:"system", date:"17.05.2026", msg:`ANKER: 107.4kg · VF13.0 · KFA27.8% · BP128/83 · Score58 · Veteran ×${VET_F.toFixed(2)}`}
  ]
};

// ============================================================
// STATE MANAGEMENT
// ============================================================
function loadState() {
  const keys = [STORE_KEY, "ppv8", "ppv7", "ppv6"];
  for (const k of keys) {
    try {
      const s = localStorage.getItem(k);
      if (s) return JSON.parse(s);
    } catch(e) {}
  }
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
}

function initState(s) {
  if (!Array.isArray(s.trainings)) s.trainings = [];
  for (const k of ["supplements","suppStreaks","mastery","masteryLevel","masteryTitles"]) {
    if (!s[k] || typeof s[k] !== "object") s[k] = {};
  }
  if (!s.statTrainXP) s.statTrainXP = {S:0,P:0,E:0,C:0,I:0,A:0,L:0};
  if (!s.ksm) s.ksm = {cycleStart:null, lastTakenDate:""};
  if (!s.pause) s.pause = {active:false, reason:"", since:""};
  if (!s.lastPenaltyDate) s.lastPenaltyDate = "";
  if (!s.globalXP && s.globalXP !== 0) s.globalXP = 0;
  return s;
}

let state = initState(loadState());

// ============================================================
// HELPERS
// ============================================================
function today() { return new Date().toLocaleDateString("de-DE"); }

function addEv(type, msg) {
  state.events.push({type, date:today(), msg});
  if (state.events.length > 300) state.events = state.events.slice(-300);
}

function daysBetween(a, b) {
  const parse = s => { const [d,m,y] = s.split("."); return new Date(+y,+m-1,+d); };
  return Math.round(Math.abs(parse(a) - parse(b)) / 86400000);
}

// ============================================================
// KSM-66
// ============================================================
function getKsmState(ksm) {
  if (!ksm?.cycleStart) return {phase:"idle", dayInPhase:0, totalDays:0, canTake:true, pct:0};
  const daysSince = Math.floor((new Date() - new Date(ksm.cycleStart)) / 86400000);
  const cycle = KSM_ON + KSM_OFF;
  const dayInCycle = daysSince % cycle;
  if (dayInCycle < KSM_ON) return {phase:"on", dayInPhase:dayInCycle+1, totalDays:KSM_ON, canTake:true, pct:((dayInCycle+1)/KSM_ON)*100};
  const offDay = dayInCycle - KSM_ON + 1;
  return {phase:"off", dayInPhase:offDay, totalDays:KSM_OFF, canTake:false, pct:(offDay/KSM_OFF)*100};
}

function toggleKsm() {
  const ks = getKsmState(state.ksm);
  if (ks.phase === "off") return;
  if (!state.ksm.cycleStart) { state.ksm.cycleStart = new Date().toISOString(); addEv("chem","KSM-66 Zyklus gestartet."); }
  const taken = state.ksm.lastTakenDate === today();
  state.ksm.lastTakenDate = taken ? "" : today();
  addEv("chem", `KSM-66 ${taken ? "✗ abgehakt" : `✓ genommen (Tag ${ks.dayInPhase}/${KSM_ON})`}`);
  saveState();
}

// ============================================================
// SUPPLEMENTS
// ============================================================
function toggleSupp(id) {
  const d = today();
  if (!state.supplements[d]) state.supplements[d] = {};
  state.supplements[d][id] = !state.supplements[d][id];
  SUPPS.forEach(s => { state.suppStreaks[s.id] = calcSuppStreak(s.id); });
  const allToday = SUPPS.every(s => state.supplements[d]?.[s.id]);
  if (allToday) {
    let consec = 0;
    for (const dt of Object.keys(state.supplements).sort().reverse()) {
      if (SUPPS.every(s => state.supplements[dt]?.[s.id])) consec++;
      else break;
    }
    if (consec > 0 && consec % 7 === 0) addEv("chem", `SUPPLEMENT STREAK: ${consec} Tage!`);
  }
  addEv("chem", `${state.supplements[d][id] ? "✓" : "✗"} ${id.toUpperCase()}`);
  // Sync to panzer_daily_supps so supplements.html stays in sync
  syncDailySuppsFromCore();
  recalcStats();
  saveState();
}

// Single source of truth: push core state.supplements into daily state
function syncDailySuppsFromCore() {
  try {
    const d = today();
    const raw = localStorage.getItem('panzer_daily_supps');
    let daily = raw ? JSON.parse(raw) : {date: d, checked: {}};
    if (daily.date !== d) daily = {date: d, checked: {}};
    // Mirror all core supps into daily checked
    const coreMap = {'kreatin':'supp_kreatin','zink':'supp_zink','magnesium':'supp_magnesium','omega3':'supp_omega','d3k2':'supp_d3'};
    for (const [coreId, dailyId] of Object.entries(coreMap)) {
      daily.checked[dailyId] = !!(state.supplements[d]?.[coreId]);
    }
    localStorage.setItem('panzer_daily_supps', JSON.stringify(daily));
  } catch(e) {}
}

function calcSuppStreak(id) {
  var sorted = Object.keys(state.supplements).sort(function(a, b) {
    var pa=a.split('.'), pb=b.split('.');
    var da=new Date(+pa[2],+pa[1]-1,+pa[0]);
    var db=new Date(+pb[2],+pb[1]-1,+pb[0]);
    return db - da; // neueste zuerst
  });
  var streak = 0;
  for (var i=0; i<sorted.length; i++) {
    if (state.supplements[sorted[i]] && state.supplements[sorted[i]][id]) streak++;
    else break;
  }
  return streak;
}

// ============================================================
// MASTERY
// ============================================================
function checkMastery(k) {
  if (state.stats[k] < 10) return null;
  const def = STAT_DEFS[k];
  switch(k) {
    case "S": {
      const eg = state.trainings.filter(t => t.type === "egym");
      if (!eg.length) return null;
      const bw = parseFloat(state.checkins.at(-1)?.weight || 100);
      const best = Math.max(...eg.map(t => t.score || 0));
      return (best/bw) >= 60 ? def.mt : null;
    }
    case "P": {
      const sl = state.checkins.filter(c => c.sleepScore && parseFloat(c.sleepScore) > 0).slice(-30);
      if (sl.length < 7) return null;
      const avg = sl.reduce((s,c) => s + parseFloat(c.sleepScore), 0) / sl.length;
      return avg >= 70 ? def.mt : null;
    }
    case "E": {
      const es = state.trainings.filter(t => t.type === "seil" || t.type === "bike");
      if (!es.length) return null;
      const best = Math.max(...es.map(t => t.type === "seil"
        ? parseFloat(t.dauer||0) * (parseFloat(t.rpm||0)/100)
        : parseFloat(t.distanz||0) * (parseFloat(t.belastung||0)/10)));
      return best >= 50 ? def.mt : null;
    }
    case "C": return Math.min(...SUPPS.map(s => state.suppStreaks[s.id]||0)) >= 30 ? def.mt : null;
    case "I": {
      const vf = state.checkins.findLast(c => c.visceral && parseFloat(c.visceral) > 0)?.visceral;
      return vf && parseFloat(vf) <= 8 ? def.mt : null;
    }
    case "A": {
      let whr = null, kfa = null;
      for (const c of [...state.checkins].reverse()) {
        if (!whr && c.taille && c.huefte) whr = parseFloat(c.taille)/parseFloat(c.huefte);
        if (!kfa && c.fat) kfa = parseFloat(c.fat);
        if (whr && kfa) break;
      }
      return whr && kfa && whr <= 0.87 && kfa <= 22 ? def.mt : null;
    }
    case "L": return (state.masteryLevel?.L || 0) >= 1 ? def.mt : null;
    default: return null;
  }
}

// ============================================================
// OBJECTIVE STAT CALCULATION
// ============================================================
function calcStats() {
  const s = {...state.stats};

  // STRENGTH — raw EGYM score / bodyweight
  const egS = state.trainings.filter(t => t.type === "egym");
  if (egS.length) {
    const bw = parseFloat(state.checkins.at(-1)?.weight || 100);
    const best = Math.max(...egS.map(t => t.score || 0));
    const r = best / bw;
    s.S = r>=60?10:r>=48?9:r>=38?8:r>=29?7:r>=21?6:r>=14?5:r>=9?4:r>=5?3:r>=2?2:1;
  }

  // PERCEPTION — 7-day avg sleep score
  const slCI = state.checkins.filter(c => c.sleepScore && parseFloat(c.sleepScore) > 0);
  if (slCI.length) {
    const avg = slCI.slice(-7).reduce((sum,c) => sum + parseFloat(c.sleepScore), 0) / Math.min(7, slCI.length);
    s.P = avg>=90?10:avg>=82?9:avg>=75?8:avg>=68?7:avg>=62?6:avg>=56?5:avg>=50?4:avg>=42?3:avg>=32?2:1;
  }

  // ENDURANCE — best seil or bike score
  const endS = state.trainings.filter(t => t.type === "seil" || t.type === "bike");
  if (endS.length) {
    const best = Math.max(...endS.map(t => t.type === "seil"
      ? parseFloat(t.dauer||0) * (parseFloat(t.rpm||0)/100)
      : parseFloat(t.distanz||0) * (parseFloat(t.belastung||0)/10)));
    s.E = best>=50?10:best>=38?9:best>=28?8:best>=20?7:best>=14?6:best>=9?5:best>=5?4:best>=2?3:best>=0.5?2:1;
  }

  // CHARISMA — avg supplement streak
  const avgStreak = SUPPS.reduce((sum,sup) => sum + (state.suppStreaks[sup.id]||0), 0) / SUPPS.length;
  s.C = avgStreak>=90?10:avgStreak>=60?9:avgStreak>=45?8:avgStreak>=30?7:avgStreak>=21?6:avgStreak>=14?5:avgStreak>=7?4:avgStreak>=3?3:avgStreak>=1?2:1;

  // INTELLIGENCE — visceral fat inverted
  const vfC = state.checkins.findLast(c => c.visceral && parseFloat(c.visceral) > 0);
  if (vfC) {
    const vf = parseFloat(vfC.visceral);
    s.I = vf<=3?10:vf<=4?9:vf<=5?8:vf<=6?7:vf<=8?6:vf<=10?5:vf<=12?4:vf<=14?3:vf<=17?2:1;
  }

  // AGILITY — WHR + KFA
  let whr = null, kfa = null;
  for (const c of [...state.checkins].reverse()) {
    if (!whr && c.taille && c.huefte && parseFloat(c.taille) > 0) whr = parseFloat(c.taille)/parseFloat(c.huefte);
    if (!kfa && c.fat && parseFloat(c.fat) > 0) kfa = parseFloat(c.fat);
    if (whr && kfa) break;
  }
  if (whr !== null || kfa !== null) {
    const ws = whr===null?null:whr<=0.75?10:whr<=0.80?9:whr<=0.84?8:whr<=0.87?7:whr<=0.90?6:whr<=0.93?5:whr<=0.95?4:whr<=0.97?3:whr<=1.00?2:1;
    const ks = kfa===null?null:kfa<=10?10:kfa<=13?9:kfa<=16?8:kfa<=19?7:kfa<=22?6:kfa<=25?5:kfa<=28?4:kfa<=32?3:kfa<=37?2:1;
    // If only one value: use it alone. If both: average.
    const agiVal = (ws!==null && ks!==null) ? Math.round((ws+ks)/2) : (ws!==null ? ws : ks);
    s.A = Math.max(1, Math.min(10, agiVal));
  }

  return s;
}

function recalcStats() {
  const newStats = calcStats();
  for (const k of KEYS) {
    if (k === "L") continue;
    const old = state.stats[k], nv = newStats[k];
    if (nv !== old) addEv(nv > old ? "level_up" : "level_down", `${k} → ${nv} ${nv > old ? "▲" : "▼"} (objektiv)`);
    state.stats[k] = nv;
    const mt = checkMastery(k);
    if (mt && !state.masteryTitles[k]) {
      state.masteryTitles[k] = mt;
      addEv("mastery", `★ MASTERY: ${mt} (${k})`);
    }
  }
  saveState();
}

// ============================================================
// PENALTY
// ============================================================
function checkPenalty() {
  if (state.pause?.active) return {days:0, active:false, paused:true};
  const dates = [...state.checkins.map(c=>c.date), ...state.trainings.map(t=>t.date)];
  if (!dates.length) return {days:0, active:false};
  const parse = s => { const [d,m,y]=s.split("."); return new Date(+y,+m-1,+d); };
  const latest = dates.reduce((a,b) => parse(a) > parse(b) ? a : b);
  const days = daysBetween(latest, today());
  if (days >= 4 && state.lastPenaltyDate !== today()) {
    state.lastPenaltyDate = today();
    const pen = [];
    for (const k of KEYS) {
      if (!STAT_DEFS[k].anchor && state.stats[k] > 1) { state.stats[k]--; pen.push(k); }
    }
    if (pen.length) { addEv("penalty", `⚠ PANZER ROSTET: ${days}d inaktiv. Abzug: ${pen.join(",")} -1`); saveState(); }
    return {days, active:true};
  }
  return {days, active: days >= 4};
}

// ============================================================
// PAUSE
// ============================================================
function togglePause(reason) {
  if (state.pause?.active) {
    const dur = daysBetween(state.pause.since, today());
    addEv("system", `PAUSE BEENDET nach ${dur}d (${state.pause.reason})`);
    state.pause = {active:false, reason:"", since:""};
    // Reset penalty clock to today so no rust penalty fires after pause
    state.lastPenaltyDate = today();
    addEv("system", "Inaktivitaets-Timer zurueckgesetzt. Kein Penalty fuer Pause-Zeitraum.");
  } else {
    state.pause = {active:true, reason: reason||"Krankheit", since:today()};
    addEv("system", `PAUSE: ${state.pause.reason}`);
  }
  saveState();
}

// ============================================================
// XP ENGINE
// ============================================================
function xpForLevel(n) { return Math.round(500 * Math.pow(n, 1.25)); }

function getLvlInfo(totalXP) {
  let xp = totalXP || 0, level = 1;
  while (xp >= xpForLevel(level)) { xp -= xpForLevel(level); level++; }
  return {level, cur:Math.round(xp), need:xpForLevel(level)};
}

function statXpThresh(v) { return Math.round(200 * Math.pow(v, 1.25)); }

function calcEgymXP(form, bw, mf) {
  let total = 0;
  const statXP = {S:0, A:0, E:0};
  for (const ex of EGYM) {
    const kg = parseFloat(form[`${ex.id}_kg`]||0);
    const wdh = parseFloat(form[`${ex.id}_wdh`]||0);
    const xp = (kg / parseFloat(bw||100)) * wdh * mf;
    total += xp;
    statXP[ex.stat] = (statXP[ex.stat]||0) + xp;
  }
  return {total: Math.round(total*10)/10, statXP};
}

function calcSeilXP(dauer, rpm) {
  const base = parseFloat(dauer||0) * (parseFloat(rpm||0)/100) * 5;
  const b = base * VET_F;
  return {total: Math.round(b*10)/10, statXP: {E: Math.round(b*0.6*10)/10, A: Math.round(b*0.4*10)/10}};
}

function calcBikeXP(distanz, belastung) {
  const base = parseFloat(distanz||0) * (parseFloat(belastung||0)/10);
  const b = base * VET_F;
  return {total: Math.round(b*10)/10, statXP: {E: Math.round(b*0.6*10)/10, A: Math.round(b*0.4*10)/10}};
}

function calcSleepXP(score) { return Math.round(parseFloat(score||0) * 0.5 * VET_F * 10) / 10; }

function applyXP(xpResult) {
  state.globalXP = (state.globalXP||0) + xpResult.total;
  if (!state.statTrainXP) state.statTrainXP = {S:0,P:0,E:0,C:0,I:0,A:0,L:0};
  for (const [k, xp] of Object.entries(xpResult.statXP)) {
    if (!xp) continue;
    if (state.stats[k] >= 10) {
      state.mastery[k] = (state.mastery[k]||0) + xp;
      const ml = Math.floor((state.mastery[k]||0) / 500);
      if (ml > (state.masteryLevel[k]||0)) {
        state.masteryLevel[k] = ml;
        addEv("mastery", `${k} OVERCHARGE +${ml} ★`);
      }
      state.statTrainXP[k] = 0;
    } else {
      state.statTrainXP[k] = (state.statTrainXP[k]||0) + xp;
      if (state.statTrainXP[k] >= statXpThresh(state.stats[k])) {
        state.statTrainXP[k] = 0;
        addEv("training", `TRN XP VOLL: ${k} Balken zurückgesetzt.`);
      }
    }
  }
}

// ============================================================
// PROCESS ACTIONS
// ============================================================
function processCheckin(f) {
  if (f.taille && f.huefte && parseFloat(f.taille) > 0 && parseFloat(f.huefte) > 0)
    f.whr = (parseFloat(f.taille)/parseFloat(f.huefte)).toFixed(3);
  if (f.sleepScore && parseFloat(f.sleepScore) > 0) {
    const sxp = calcSleepXP(f.sleepScore);
    state.globalXP = (state.globalXP||0) + sxp;
    state.statTrainXP.P = (state.statTrainXP.P||0) + sxp;
    f.sleepXP = sxp;
  }
  state.checkins.push({date:today(), ...f});
  addEv("checkin", `CHECK-IN: ${f.weight}kg · VF${f.visceral}${f.whr ? ` · WHR:${f.whr}` : ""}${f.sleepScore ? ` · Score:${f.sleepScore}${f.sleepXP ? ` (+${f.sleepXP}XP)` : ""}` : ""}`);
  recalcStats();
  saveState();
}

function processEgym(f) {
  const bw = parseFloat(state.checkins.at(-1)?.weight || 100);
  const modeObj = EGYM_MODES.find(m => m.id === f.modeId) || EGYM_MODES[3];
  const score = EGYM.reduce((sum,ex) => sum + parseFloat(f[`${ex.id}_kg`]||0) * parseFloat(f[`${ex.id}_wdh`]||0), 0);
  const xpR = calcEgymXP(f, bw, modeObj.factor);
  const prev = state.trainings.filter(t => t.type === "egym");
  const ps = prev.at(-1)?.score || 0;
  state.trainings.push({type:"egym", date:today(), score:Math.round(score), modeId:modeObj.id, modeFactor:modeObj.factor, sessionXP:xpR.total, ...f});
  applyXP(xpR);
  addEv("training", `EGYM [${modeObj.name}]: Score ${Math.round(score)} · +${xpR.total} XP${score>ps?" ▲":score<ps?" ▼":""}`);
  recalcStats();
  saveState();
}

function processSeil(f) {
  const xpR = calcSeilXP(f.dauer, f.rpm);
  const sessionXP = (xpR && xpR.total) ? xpR.total : 0;

  // Check if a seil session already exists for today — update it instead of adding new
  const todayIdx = state.trainings.findIndex(function(t){ return t.type==='seil' && t.date===today(); });
  if (todayIdx >= 0) {
    const existing = state.trainings[todayIdx];
    // Accumulate values
    const newDauer  = (parseFloat(existing.dauer||0) + parseFloat(f.dauer||0));
    const newRunden = (parseInt(existing.runden||0,10) + parseInt(f.runden||0,10));
    // Weighted average RPM
    const newRPM = existing.rpm && f.rpm
      ? Math.round((parseFloat(existing.rpm)*parseFloat(existing.dauer||1) + parseFloat(f.rpm)*parseFloat(f.dauer||1)) / newDauer)
      : parseFloat(existing.rpm||f.rpm||0);
    // Recalc XP for combined session
    const combinedXP = calcSeilXP(newDauer, newRPM);
    const combinedSessionXP = (combinedXP && combinedXP.total) ? combinedXP.total : 0;

    // XP diff: add only the delta
    const xpDelta = combinedSessionXP - parseFloat(existing.sessionXP||0);
    if (xpDelta > 0) {
      state.globalXP = (state.globalXP||0) + xpDelta;
      state.statTrainXP.E = (state.statTrainXP.E||0) + xpDelta*0.6;
      state.statTrainXP.A = (state.statTrainXP.A||0) + xpDelta*0.4;
    }

    // Update existing entry in place
    state.trainings[todayIdx] = {
      type:'seil', date:today(),
      dauer:newDauer, rpm:newRPM, runden:newRunden,
      sessionXP:combinedSessionXP,
      note: [existing.note, f.note].filter(Boolean).join(' + ')
    };
    addEv("training", "SEIL +: "+newDauer.toFixed(1)+"min · "+newRPM+"RPM · "+newRunden+"R · Gesamt "+combinedSessionXP+" XP");
  } else {
    // First session of the day — just push
    state.trainings.push({type:'seil', date:today(), sessionXP:sessionXP, dauer:parseFloat(f.dauer||0), rpm:parseFloat(f.rpm||0), runden:parseInt(f.runden||0,10), note:f.note||''});
    applyXP(xpR);
    addEv("training", "SEIL: "+f.dauer+"min · "+f.rpm+"RPM · "+f.runden+"R · +"+sessionXP+" XP");
  }
  recalcStats();
  saveState();
}

function processBike(f) {
  const xpR = calcBikeXP(f.distanz, f.belastung);
  state.trainings.push({type:"bike", date:today(), sessionXP:xpR.total, ...f});
  applyXP(xpR);
  addEv("training", `RAD: ${f.distanz}km · ${f.avgSpeed}km/h · Bel:${f.belastung} · +${xpR.total} XP`);
  recalcStats();
  saveState();
}

// ============================================================
// MIGRATION
// ============================================================
function migrateAndInit() {
  // Guard: never lose checkins during migration
  const savedCheckins = state.checkins ? [...state.checkins] : [];
  // Fix EGYM scores: raw kg*wdh only, no mode factor
  let needRecalc = false;
  for (const t of state.trainings) {
    if (t.type === "egym") {
      const raw = EGYM.reduce((sum,ex) => sum + parseFloat(t[`${ex.id}_kg`]||0) * parseFloat(t[`${ex.id}_wdh`]||0), 0);
      if (t.score !== Math.round(raw)) { t.score = Math.round(raw); needRecalc = true; }
    }
  }
  if (needRecalc || (state.globalXP === 0 && state.trainings.length > 0)) {
    state.globalXP = 0;
    state.statTrainXP = {S:0,P:0,E:0,C:0,I:0,A:0,L:0};
    const bw = parseFloat(state.checkins.at(-1)?.weight || 100);
    for (const t of state.trainings) {
      let r;
      if (t.type === "egym") r = calcEgymXP(t, bw, t.modeFactor||1.4);
      else if (t.type === "seil") r = calcSeilXP(t.dauer, t.rpm);
      else if (t.type === "bike") r = calcBikeXP(t.distanz, t.belastung);
      if (r) {
        state.globalXP += r.total;
        for (const [k,xp] of Object.entries(r.statXP)) state.statTrainXP[k] = (state.statTrainXP[k]||0) + xp;
      }
    }
    if (needRecalc) addEv("system", "v12: EGYM Scores neu berechnet (ohne Modusfaktor).");
  }
  // Restore checkins if migration wiped them
  if (state.checkins.length === 0 && savedCheckins.length > 0) {
    state.checkins = savedCheckins;
    addEv('system','Koerpermaße wiederhergestellt nach Migration.');
  }
  recalcStats();
  checkPenalty();
}

migrateAndInit();

function exportData() {

  var exportState = JSON.parse(JSON.stringify(state));

  exportState._ksmStart  = state.ksm ? state.ksm.cycleStart : null;

  const b = new Blob([JSON.stringify(exportState, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "wasteland-panzer-" + today().replace(/\./g,"-") + ".json";
  a.click();
}

function importData(file, onDone) {
  var r = new FileReader();
  r.onload = function(ev) {
    try {
      var imp = JSON.parse(ev.target.result);
      if (imp.stats && imp.checkins) {
        // Restore external keys if present in export
        if (imp._bkurStart) localStorage.setItem('panzer_bkur_start', imp._bkurStart);
        if (imp._dailySupps) localStorage.setItem('panzer_daily_supps', imp._dailySupps);
        delete imp._bkurStart; delete imp._ksmStart; delete imp._dailySupps;
        Object.assign(state, initState(imp));
        migrateAndInit();
        saveState();
        if (onDone) onDone(true);
      } else { if (onDone) onDone(false); }
    } catch(e) { if (onDone) onDone(false); }
  };
  r.readAsText(file);
}

  localStorage.removeItem(STORE_KEY);
  Object.assign(state, initState(JSON.parse(JSON.stringify(DEFAULT_STATE))));

function deleteTraining(idx) {

  var removed = state.trainings.splice(idx, 1)[0];
  // Recalc XP from scratch
  state.globalXP = 0;
  state.statTrainXP = {S:0,P:0,E:0,C:0,I:0,A:0,L:0};
  var bw = parseFloat((state.checkins[state.checkins.length-1]||{}).weight||100);
  state.trainings.forEach(function(t) {
    var r;
    if (t.type==='egym') r = calcEgymXP(t, bw, t.modeFactor||1.4);

    else if (t.type==='bike') r = calcBikeXP(t.distanz, t.belastung);

// CHECK-IN VALIDATION (inline, no confirm dialog)
// ============================================================
var VALIDATION_LIMITS = {
  weight:   2.0,
  muscle:   1.5,
  fat:      1.5,
  visceral: 1.0
};

// Returns object: {valid: bool, errors: {fieldId: message}}
function validateCheckinInline(newVals) {
  var last = null;
  for (var i = state.checkins.length - 1; i >= 0; i--) {
    var c = state.checkins[i];
    if (c.weight && parseFloat(c.weight) > 0) { last = c; break; }
  }
  if (!last) return {valid:true, errors:{}};

  var errors = {};
  var checks = [
    {field:'ci_weight',   newV:newVals.weight,   lastV:last.weight,   limit:VALIDATION_LIMITS.weight,   unit:'kg'},
    {field:'ci_muscle',   newV:newVals.muscle,   lastV:last.muscle,   limit:VALIDATION_LIMITS.muscle,   unit:'kg'},
    {field:'ci_fat',      newV:newVals.fat,       lastV:last.fat,      limit:VALIDATION_LIMITS.fat,      unit:'%'},
    {field:'ci_visceral', newV:newVals.visceral,  lastV:last.visceral, limit:VALIDATION_LIMITS.visceral, unit:'Pkt'},
  ];

  checks.forEach(function(c) {
    if (c.newV && c.lastV && parseFloat(c.newV) > 0 && parseFloat(c.lastV) > 0) {
      var diff = Math.abs(parseFloat(c.newV) - parseFloat(c.lastV));
      if (diff > c.limit) {
        errors[c.field] = 'Abw. ' + diff.toFixed(1) + c.unit + ' (max ' + c.limit + c.unit + ')';
      }
    }
  });

  return {valid: Object.keys(errors).length === 0, errors: errors};
}

// Apply inline error styles to fields
function applyCheckinErrors(errors) {
  // Reset all first
  ['ci_weight','ci_muscle','ci_fat','ci_visceral'].forEach(function(id) {
    var el = document.getElementById(id);
    var errEl = document.getElementById(id + '_err');
    if (el) { el.style.borderColor = ''; el.style.color = ''; }
    if (errEl) errEl.remove();
  });
  // Apply errors
  Object.keys(errors).forEach(function(id) {
    var el = document.getElementById(id);
    if (el) {
      el.style.borderColor = 'var(--red)';
      el.style.color = 'var(--red)';
      el.value = ''; // Clear only the bad field
      el.focus();
      // Insert error message below field
      var errDiv = document.createElement('div');
      errDiv.id = id + '_err';
      errDiv.style.cssText = 'font-size:8px;color:var(--red);margin-top:2px;letter-spacing:1px;';
      errDiv.textContent = errors[id];
      el.parentNode.appendChild(errDiv);
    }
  });
}

  state.checkins.splice(idx, 1);
  addEv('system', 'Check-in geloescht (Index ' + idx + ')');

}

// RADAR
function drawRadar(canvas) {
  const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2, R=Math.min(W,H)*0.37;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,W,H);
  const labels=["STR","PER","END","INT","AGI","LCK"];
  const keys=["S","P","E","I","A","L"];
  const N=6;
  const vals = keys.map(k => state.stats[k]);
  const pt = (i,v) => { const a=(Math.PI*2*i/N)-Math.PI/2; return {x:cx+R*(v/10)*Math.cos(a), y:cy+R*(v/10)*Math.sin(a)}; };
  const op = i => { const a=(Math.PI*2*i/N)-Math.PI/2; return {x:cx+R*Math.cos(a), y:cy+R*Math.sin(a)}; };

  for (let ring=2; ring<=10; ring+=2) {
    ctx.beginPath();
    for (let i=0;i<N;i++) { const p=pt(i,ring); i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); }
    ctx.closePath();
    ctx.strokeStyle = ring===10?"rgba(68,255,68,0.3)":"rgba(68,255,68,0.1)";
    ctx.lineWidth = 1; ctx.stroke();
  }
  for (let i=0;i<N;i++) {
    const o=op(i); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(o.x,o.y);
    ctx.strokeStyle="rgba(68,255,68,0.2)"; ctx.lineWidth=1; ctx.stroke();
  }

  ctx.beginPath();
  vals.forEach((v,i) => { const p=pt(i,v); i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); });
  ctx.closePath();
  ctx.fillStyle="rgba(68,255,68,0.15)"; ctx.fill();
  ctx.strokeStyle="rgba(68,255,68,0.9)"; ctx.lineWidth=2;
  ctx.shadowColor="#44ff44"; ctx.shadowBlur=8; ctx.stroke(); ctx.shadowBlur=0;

  vals.forEach((v,i) => {
    const p=pt(i,v);
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fillStyle="#44ff44"; ctx.shadowColor="#44ff44"; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
  });

  ctx.textAlign="center"; ctx.textBaseline="middle";
  labels.forEach((lbl,i) => {
    const a=(Math.PI*2*i/N)-Math.PI/2;
    ctx.font='bold 8px "Share Tech Mono"'; ctx.fillStyle="#88cc88"; ctx.shadowColor="#44ff44"; ctx.shadowBlur=3;
    ctx.fillText(lbl, cx+(R+16)*Math.cos(a), cy+(R+16)*Math.sin(a));
    const vp=pt(i,vals[i]);
    ctx.font='bold 9px "Orbitron"'; ctx.fillStyle="#aaffaa"; ctx.shadowBlur=5;
    ctx.fillText(vals[i], vp.x+Math.cos(a)*9, vp.y+Math.sin(a)*9);
  });
  ctx.shadowBlur=0;
}

// SPARKLINE
function drawSparkline(canvas, values, isGood) {
  if (!canvas || values.length < 2) return;
  const W=canvas.width, H=canvas.height, ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,W,H);
  const min=Math.min(...values), max=Math.max(...values), range=max-min||1;
  const pts = values.map((v,i) => ({x:(i/(values.length-1))*W, y:H-((v-min)/range)*(H-4)-2}));
  const col = isGood?"rgba(68,255,68,":"rgba(255,68,68,";

  ctx.beginPath(); ctx.moveTo(pts[0].x,H);
  pts.forEach(p => ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts.at(-1).x,H); ctx.closePath();
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,col+"0.3)"); g.addColorStop(1,col+"0.02)");
  ctx.fillStyle=g; ctx.fill();

  ctx.beginPath();
  pts.forEach((p,i) => i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.strokeStyle=isGood?"rgba(68,255,68,0.9)":"rgba(255,68,68,0.8)";
  ctx.lineWidth=1.5; ctx.shadowColor=isGood?"#44ff44":"#ff4444"; ctx.shadowBlur=4; ctx.stroke(); ctx.shadowBlur=0;

  const last=pts.at(-1);
  ctx.beginPath(); ctx.arc(last.x,last.y,2.5,0,Math.PI*2);
  ctx.fillStyle=isGood?"#44ff44":"#ff4444"; ctx.shadowColor=isGood?"#44ff44":"#ff4444";
  ctx.shadowBlur=7; ctx.fill(); ctx.shadowBlur=0;
}

@keyframes tout{from{opacity:1}to{opacity:0}}
`;

document.querySelector('style').textContent = SHARED_CSS;

var QUEST_STATE_KEY = 'panzer_quests';

function getWeekStart() {
  var now = new Date(), day=now.getDay();
  var mon = new Date(now);
  mon.setDate(now.getDate()-day+(day===0?-6:1));
  mon.setHours(0,0,0,0); return mon;
}
function getWeekKey(){ return getWeekStart().toLocaleDateString('de-DE'); }
function loadQuestState(){
  try{ var r=localStorage.getItem(QUEST_STATE_KEY); if(!r) return {};
    var d=JSON.parse(r); if(d.weekKey!==getWeekKey()) return {}; return d;
  }catch(e){return {};}
}
function saveQuestState(qs){ qs.weekKey=getWeekKey(); try{localStorage.setItem(QUEST_STATE_KEY,JSON.stringify(qs));}catch(e){} }

function parseDE(s){ var p=s.split('.'); return new Date(+p[2],+p[1]-1,+p[0]); }

function calcEisenBiegen(){
  var ws=getWeekStart(), days=new Set();
  state.trainings.forEach(function(t){
    if(t.type==='egym'&&parseDE(t.date)>=ws) days.add(t.date);
  });
  var c=days.size; return {count:c, done:c>=2};
}
function calcWieselflink(){
  var ws=getWeekStart(), days=new Set();
  state.trainings.forEach(function(t){
    if((t.type==='seil'||t.type==='bike')&&parseDE(t.date)>=ws) days.add(t.date);
  });
  var c=days.size; return {count:c, done:c>=2};
}
function calcBittererErnst(){
  var ws=getWeekStart(), count=0;
  Object.keys(state.supplements||{}).forEach(function(ds){
    var entry=state.supplements[ds];
    if(entry && parseDE(ds)>=ws && (entry['supp_heidelberger']||entry['heidelberger'])) count++;
  });
  // Also check panzer_daily_supps for today if not yet in state
  try {
    var daily=JSON.parse(localStorage.getItem('panzer_daily_supps')||'{}');
    if(daily.date===today() && daily.checked && (daily.checked['supp_heidelberger']||daily.checked['heidelberger'])) {
      if(!(state.supplements[today()]&&(state.supplements[today()]['supp_heidelberger']||state.supplements[today()]['heidelberger']))) count++;
    }
  } catch(e){}
  return {count:count, done:count>=5};
}

function claimQuest(questId){
  var qs=loadQuestState();
  if(qs[questId+'_claimed']){toast('Bereits abgeholt!');return;}
  var eisen=calcEisenBiegen(),flink=calcWieselflink(),bitter=calcBittererErnst(),coopOk=!!qs['coop_checked'];
  var xp=50;
  if(questId==='eisen'){
    if(!eisen.done){toast('Noch nicht erfuellt!','err');return;}
    state.globalXP=(state.globalXP||0)+xp; state.statTrainXP.S=(state.statTrainXP.S||0)+xp;
    addEv('level_up','RAID: Eisen biegen +'+xp+' XP (STR)');
  } else if(questId==='flink'){
    if(!flink.done){toast('Noch nicht erfuellt!','err');return;}
    state.globalXP=(state.globalXP||0)+xp; state.statTrainXP.A=(state.statTrainXP.A||0)+xp;
    addEv('level_up','RAID: Wieselflink +'+xp+' XP (AGI)');
  } else if(questId==='bitter'){
    if(!bitter.done){toast('Noch nicht erfuellt!','err');return;}
    state.globalXP=(state.globalXP||0)+xp; state.statTrainXP.C=(state.statTrainXP.C||0)+xp;
    addEv('level_up','RAID: Bitterer Ernst +'+xp+' XP (CHA)');
  } else if(questId==='coop'){
    if(!coopOk){toast('Zuerst bestaetigen!','err');return;}
    state.globalXP=(state.globalXP||0)+xp; state.statTrainXP.L=(state.statTrainXP.L||0)+xp;
    addEv('level_up','RAID: Co-Op Support +'+xp+' XP (LCK)');
  }
  qs[questId+'_claimed']=true;
  saveQuestState(qs); saveState();
  toast('Quest abgegeben! +'+xp+' XP');
  render();
}
function toggleCoopCheck(){
  var qs=loadQuestState(); qs['coop_checked']=!qs['coop_checked']; saveQuestState(qs); render();
}

function renderWeeklyRaids(){
  var qs=loadQuestState();
  var eisen=calcEisenBiegen(),flink=calcWieselflink(),bitter=calcBittererErnst(),coopOk=!!qs['coop_checked'];
  var raids=[
    {id:'eisen',name:'EISEN BIEGEN',   desc:'EGYM an 2+ Tagen',            prog:eisen.count+'/2', pct:Math.min(100,eisen.count/2*100),  done:eisen.done, col:'var(--glow)',  reward:'+50 XP STR',claimed:!!qs['eisen_claimed']},
    {id:'flink',name:'WIESELFLINK',    desc:'Seil/Rad/Ergo an 2+ Tagen',   prog:flink.count+'/2', pct:Math.min(100,flink.count/2*100),  done:flink.done, col:'var(--blue)',  reward:'+50 XP AGI',claimed:!!qs['flink_claimed']},
    {id:'bitter',name:'BITTERER ERNST',desc:'Heidelberger 5x diese Woche', prog:bitter.count+'/5',pct:Math.min(100,bitter.count/5*100), done:bitter.done,col:'var(--amber)', reward:'+50 XP CHA',claimed:!!qs['bitter_claimed']},
    {id:'coop', name:'CO-OP SUPPORT',  desc:'Frayas Handball begleitet',   prog:coopOk?'1/1':'0/1',pct:coopOk?100:0,                   done:coopOk,     col:'var(--purple)',reward:'+50 XP LCK',claimed:!!qs['coop_claimed'],manual:true}
  ];
  var h='<div style="font-size:8px;color:var(--gdim);letter-spacing:2px;margin-bottom:6px;border-top:1px solid var(--gdim);padding-top:5px;">&#9876; WEEKLY RAIDS</div>';
  for(var ri=0;ri<raids.length;ri++){
    var r=raids[ri];
    var bc=r.claimed?'#333':r.done?r.col:'var(--gdim)';
    h+='<div style="border:1px solid '+bc+';padding:8px 10px;margin-bottom:6px;background:var(--gfaint);opacity:'+(r.claimed?'0.45':'1')+';">';
    h+='<div style="display:flex;justify-content:space-between;margin-bottom:3px;">';
    h+='<div style="font-size:9px;color:'+r.col+';letter-spacing:1px;font-weight:bold;">'+r.name+'</div>';
    h+='<div style="font-size:9px;color:'+(r.done?r.col:'var(--gdim)')+';">'+r.prog+'</div></div>';
    h+='<div style="font-size:8px;color:var(--gdim);margin-bottom:4px;">'+r.desc+'</div>';
    h+='<div style="height:4px;background:var(--g1);border:1px solid var(--gdim);overflow:hidden;margin-bottom:5px;"><div style="height:100%;width:'+r.pct+'%;background:'+r.col+';transition:width .5s;"></div></div>';
    if(r.manual&&!r.claimed){
      h+='<div onclick="toggleCoopCheck()" style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:5px;">';
      h+='<div style="width:16px;height:16px;border:1px solid '+(coopOk?r.col:'var(--gdim)')+';background:'+(coopOk?r.col:'transparent')+';display:flex;align-items:center;justify-content:center;">';
      if(coopOk) h+='<span style="color:#000;font-size:10px;font-weight:bold;">v</span>';
      h+='</div><div style="font-size:8px;color:var(--gdim);">Bestaetigen</div></div>';
    }
    if(!r.claimed&&r.done){
      h+='<div class="qclaim" data-qid="'+r.id+'" style="cursor:pointer;text-align:center;padding:5px;border:1px solid '+r.col+';color:'+r.col+';font-size:9px;letter-spacing:1px;">QUEST ABGEBEN -- '+r.reward+'</div>';
    } else if(r.claimed){
      h+='<div style="text-align:center;font-size:8px;color:var(--gdim);">ABGESCHLOSSEN v</div>';
    } else {
      h+='<div style="text-align:center;font-size:8px;color:var(--gdim);">'+r.reward+' bei Abgabe</div>';
    }
    h+='</div>';
  }
  return h;
}

function render() {
  var latest=state.checkins[state.checkins.length-1]||{};
  var visVal=parseFloat(latest.visceral||99);
  var gLvl=getLvlInfo(state.globalXP), gPct=Math.round((gLvl.cur/gLvl.need)*100);
  var todaySupps=state.supplements[today()]||{};
  var penalty=checkPenalty();
  var ksmSt=getKsmState(state.ksm), ksmTaken=state.ksm.lastTakenDate===today();
  var paused=state.pause&&state.pause.active;

  var h=renderTopbar('main');
  h+='<div class="scroll"><div class="pad">';

  // CHEMS
  var takenCnt=SUPPS.filter(function(s){return todaySupps[s.id];}).length;
  h+='<div style="border:1px solid var(--gdim);padding:6px 10px;margin-bottom:8px;background:var(--gfaint);">';
  h+='<div style="font-size:8px;color:var(--gdim);letter-spacing:2px;margin-bottom:5px;">CHEMS -- HEUTE '+takenCnt+'/'+SUPPS.length+'</div>';
  h+='<div style="display:flex;gap:4px;margin-bottom:5px;">';
  SUPPS.forEach(function(s){
    var taken=!!todaySupps[s.id], streak=state.suppStreaks[s.id]||calcSuppStreak(s.id);
    h+='<div class="stoggle" data-sid="'+s.id+'" style="flex:1;cursor:pointer;padding:3px 4px;border:1px solid '+(taken?'var(--glow)':'var(--gdim)')+';background:'+(taken?'var(--gfaint)':'var(--g0)')+';text-align:center;">';
    h+='<div style="font-size:14px">'+s.icon+'</div>';
    h+='<div style="font-size:6px;color:'+(taken?'var(--glow)':'var(--gdim)')+'">'+s.name+'</div>';
    h+='<div style="font-size:6px;color:'+(taken?'var(--glow)':'var(--gdim)')+'">'+streak+'d</div></div>';
  });
  h+='</div>';

  // KSM
  var ksmPhaseOff=ksmSt.phase==='off';
  h+='<div onclick="'+(ksmPhaseOff?'':'handleToggleKsm()')+'" style="display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid '+(ksmPhaseOff?'#442244':'var(--purple)')+';background:'+(ksmTaken?'#110011':'var(--g0)')+';cursor:'+(ksmPhaseOff?'default':'pointer')+';opacity:'+(ksmPhaseOff?'0.6':'1')+';">';
  h+='<div style="font-size:14px">&#127807;</div><div style="flex:1;">';
  h+='<div style="font-size:8px;color:var(--purple);letter-spacing:1px;">KSM-66 ASHWAGANDHA</div>';
  if(ksmSt.phase==='idle') h+='<div style="font-size:8px;color:var(--gdim);">Tippen zum Starten</div>';
  else if(ksmPhaseOff){h+='<div style="font-size:9px;color:var(--red);font-weight:bold;">PAUSE Tag '+ksmSt.dayInPhase+'/'+ksmSt.totalDays+'</div><div style="height:4px;background:var(--g1);margin-top:2px;overflow:hidden;"><div style="height:100%;width:'+ksmSt.pct+'%;background:var(--red);"></div></div>';}
  else{h+='<div style="font-size:9px;color:var(--glow);font-weight:bold;">'+(ksmTaken?'+ GENOMMEN':'NOCH NICHT')+' Tag '+ksmSt.dayInPhase+'/'+ksmSt.totalDays+'</div><div style="height:4px;background:var(--g1);margin-top:2px;overflow:hidden;"><div style="height:100%;width:'+ksmSt.pct+'%;background:var(--purple);"></div></div>';}
  h+='</div></div></div>';

  // RADAR
  h+='<div style="display:flex;flex-direction:column;align-items:center;padding:6px 0 2px;">';
  h+='<div style="font-size:8px;color:var(--gdim);letter-spacing:3px;margin-bottom:3px;">S.P.E.C.I.A.L. RADAR</div>';
  h+='<canvas id="radar" width="260" height="200"></canvas></div>';

  // STAT BARS
  h+='<div class="section-title">S.P.E.C.I.A.L. -- OBJEKTIVE WERTE</div>';
  KEYS.forEach(function(k){
    var def=STAT_DEFS[k],val=state.stats[k],trainXP=state.statTrainXP[k]||0;
    var isMastery=val>=10,mTitle=(state.masteryTitles||{})[k]||null;
    var mLvl=(state.masteryLevel||{})[k]||0,mXP=(state.mastery||{})[k]||0;
    var thresh=statXpThresh(val);
    var tPct=isMastery?Math.min(100,Math.round((mXP%500)/500*100)):Math.min(100,Math.round((trainXP/thresh)*100));
    var dispNum=isMastery?'10'+(mLvl>0?'+'+mLvl:'*'):val+'/10';
    h+='<div style="margin-bottom:5px;">';
    h+='<div style="display:flex;align-items:center;gap:5px;margin-bottom:1px;">';
    h+='<div style="width:26px;font-size:9px;color:var(--glow);">'+def.short+':</div>';
    h+='<div style="width:32px;font-size:8px;color:'+(isMastery?'var(--amber)':'var(--textbright)')+';text-align:right;">'+dispNum+'</div>';
    h+='<div style="flex:1;height:7px;background:var(--g1);border:1px solid var(--gdim);position:relative;overflow:hidden;">';
    h+='<div style="height:100%;width:'+(isMastery?100:val*10)+'%;background:'+(isMastery?'linear-gradient(90deg,var(--amber),#ffcc44)':'var(--glow)')+';box-shadow:0 0 '+(isMastery?10:5)+'px '+(isMastery?'var(--amber)':'var(--glow)')+';transition:width .5s;"></div>';
    if(!isMastery)[2,4,6,8].forEach(function(p){h+='<div style="position:absolute;top:0;height:100%;left:'+p*10+'%;width:2px;background:rgba(0,0,0,0.4);"></div>';});
    h+='</div>';
    h+='<div style="width:80px;font-size:6px;color:var(--gdim);text-align:right;">'+def.basis+'</div></div>';
    if(mTitle) h+='<div style="font-size:7px;color:var(--amber);padding-left:26px;margin-bottom:2px;">* '+mTitle+'</div>';
    h+='<div style="display:flex;align-items:center;gap:5px;">';
    h+='<div style="width:26px;font-size:7px;color:var(--amber);">'+(isMastery?'OVR:':'TRN:')+'</div>';
    h+='<div style="width:32px;font-size:7px;color:var(--amber);text-align:right;">'+tPct+'%</div>';
    h+='<div style="flex:1;height:4px;background:var(--g1);border:1px solid #332200;overflow:hidden;"><div style="height:100%;width:'+tPct+'%;background:linear-gradient(90deg,var(--amber),#ffcc44);transition:width .5s;"></div></div>';
    h+='<div style="width:80px;font-size:7px;color:#554400;text-align:right;">'+Math.round(isMastery?mXP%500:trainXP)+'/'+(isMastery?500:thresh)+'</div></div></div>';
  });

  // TRENDS
  var tFields=[{id:'weight',lbl:'GEWICHT',unit:'kg',dec:1,lower:true},{id:'visceral',lbl:'VISZERALFETT',unit:'',dec:1,lower:true},{id:'muscle',lbl:'MUSKELMASSE',unit:'kg',dec:1,lower:false},{id:'fat',lbl:'KFA',unit:'%',dec:1,lower:true}];
  h+='<div class="section-title">TREND-MONITOR</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px;">';
  if(state.checkins.length<2){h+='<div style="grid-column:1/-1;font-size:9px;color:var(--gdim);">Mind. 2 Check-ins.</div>';}
  else{tFields.forEach(function(tf){

    var lv=vals[vals.length-1],half=Math.max(1,Math.floor(vals.length/2));
    var rA=vals.slice(-half).reduce(function(s,v){return s+v;},0)/half, oA=vals.slice(0,half).reduce(function(s,v){return s+v;},0)/half;
    var diff=rA-oA,isFlat=Math.abs(diff)<0.3,isPos=tf.lower?diff<0:diff>0;
    var arrow=isFlat?'->':diff<0?'down':'up', col=isFlat?'var(--gdim)':isPos?'var(--glow)':'var(--red)';
    h+='<div class="data-card"><div style="font-size:7px;color:var(--gdim);margin-bottom:2px;">'+tf.lbl+'</div>';
    h+='<div style="font-family:var(--fontd);font-size:15px;color:var(--textbright);">'+lv.toFixed(tf.dec)+tf.unit+' <span style="color:'+col+'">'+(arrow==='down'?'&#8595;':arrow==='up'?'&#8593;':'&#8594;')+'</span></div>';
    h+='<div style="font-size:8px;color:'+col+';margin-top:2px;">'+(isFlat?'stabil':(isPos?'v ':'^ ')+Math.abs(diff).toFixed(tf.dec)+tf.unit)+'</div>';
    h+='<canvas id="sp_'+tf.id+'" width="110" height="24" style="margin-top:4px;"></canvas></div>';
  });}
  h+='</div>';

  // MEASUREMENTS
  h+='<div style="font-size:8px;color:var(--gdim);letter-spacing:2px;padding:4px 0 2px;border-top:1px solid var(--gdim);">KOERPERMASSE (cm)</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-bottom:8px;">';
  MEAS.forEach(function(m){var val=latest[m.id];h+='<div style="background:var(--g1);border:1px solid var(--gdim);padding:4px 5px;text-align:center;"><div style="font-size:6px;color:var(--gdim);">'+m.name.toUpperCase()+'</div><div style="font-size:11px;color:'+(val?'var(--textbright)':'var(--gdim)')+';font-family:'+(val?'var(--fontd)':'var(--font)')+';">'+(val||'--')+'</div></div>';});
  var whrVal=latest.whr||(latest.taille&&latest.huefte&&parseFloat(latest.taille)>0?(parseFloat(latest.taille)/parseFloat(latest.huefte)).toFixed(3):null);
  h+='<div style="grid-column:1/-1;border:1px solid var(--amber);background:#0a0800;padding:4px 5px;text-align:center;"><div style="font-size:6px;color:var(--amber);">WAIST-TO-HIP RATIO</div><div style="font-size:12px;color:var(--amber);font-family:var(--fontd);">'+(whrVal||'--')+'</div></div>';
  h+='</div>';

  // QUESTS
  h+='<div class="section-title">QUEST LOG</div>';
  QUESTS.forEach(function(q){
    var unlocked=!q.locked||(q.unlockAt&&q.unlockAt(visVal));
    h+='<div style="border:1px solid var(--gdim);padding:5px 8px;margin-bottom:4px;position:relative;background:var(--gfaint);opacity:'+(unlocked?1:0.5)+';">';
    h+='<span style="display:inline-block;font-size:7px;padding:1px 4px;margin-bottom:2px;border:1px solid '+(q.badge==='active'?'var(--glow)':q.badge==='dauerquest'?'var(--amber)':'var(--gdim)')+';color:'+(q.badge==='active'?'var(--glow)':q.badge==='dauerquest'?'var(--amber)':'var(--gdim)')+'">['+(q.badge==='active'?'!':q.badge==='dauerquest'?'~':'?')+']</span>';
    h+='<span style="position:absolute;top:5px;right:7px;font-size:7px;color:'+(unlocked&&q.badge!=='locked'?'var(--glow)':'var(--gdim)')+';">'+(unlocked&&q.badge!=='locked'?'AKTIV':'GESPERRT')+'</span>';
    h+='<div style="font-size:10px;color:var(--textbright);">'+q.title.toUpperCase()+'</div>';
    h+='<div style="font-size:8px;color:var(--gdim);">Requirements: '+q.req+'</div></div>';
  });

  // WEEKLY RAIDS
  h+='<div style="padding:0 0 4px;">'+renderWeeklyRaids()+'</div>';

  h+='<button class="btn" onclick="openCheckinModal()">CHECK-IN</button>';
  h+='</div></div>';
  document.getElementById('root').innerHTML=h;

  requestAnimationFrame(function(){
    var c=document.getElementById('radar');if(c)drawRadar(c);
    [{id:'weight',lower:true},{id:'visceral',lower:true},{id:'muscle',lower:false},{id:'fat',lower:true}].forEach(function(tf){
      var c2=document.getElementById('sp_'+tf.id);if(!c2)return;
      var vals=state.checkins.filter(function(x){return x[tf.id]&&parseFloat(x[tf.id])>0;}).map(function(x){return parseFloat(x[tf.id]);});
      if(vals.length>=2){var h2=Math.max(1,Math.floor(vals.length/2));var rA=vals.slice(-h2).reduce(function(s,v){return s+v;},0)/h2;var oA=vals.slice(0,h2).reduce(function(s,v){return s+v;},0)/h2;drawSparkline(c2,vals,tf.lower?rA<oA:rA>oA);}
    });
    // Event delegation for quest claim
    var rootEl=document.getElementById('root');
    if(rootEl){rootEl.addEventListener('click',function(e){
      var qel=e.target.closest('.qclaim'); if(qel)claimQuest(qel.getAttribute('data-qid'));
      var sel=e.target.closest('.stoggle'); if(sel)handleToggleSupp(sel.getAttribute('data-sid'));
    },{once:true});}
  });
}

function handleToggleSupp(id){toggleSupp(id);render();}
function handleToggleKsm(){toggleKsm();render();}

function openCheckinModal(){
  var mh='<div class="modal-title">KOERPER CHECK-IN</div><div class="modal-sub">S400 / T-REX 3 / BLUTDRUCK / MASSBAND</div>';
  mh+='<div class="modal-sec">KOERPERDATEN</div><div class="f-g2">';
  [['weight','Gewicht kg','107.4'],['visceral','Viszeralfett','13.0'],['muscle','Muskelmasse kg','73.1'],['fat','KFA %','27.8']].forEach(function(x){mh+='<div class="f-wrap"><div class="f-lbl">'+x[1]+'</div><input class="f-in" id="ci_'+x[0]+'" placeholder="'+x[2]+'" inputmode="decimal"></div>';});
  mh+='</div><div class="f-g2">';
  [['bp','Blutdruck','128/83'],['sleep','Schlaf h','4.5'],['sleepScore','Schlaf-Score','58'],['note','Notiz','']].forEach(function(x){mh+='<div class="f-wrap"><div class="f-lbl">'+x[1]+'</div><input class="f-in" id="ci_'+x[0]+'" placeholder="'+x[2]+'" inputmode="'+(x[0]==='bp'||x[0]==='note'?'text':'decimal')+'"></div>';});
  mh+='</div><div class="modal-sec">KOERPERMASSE (cm)</div>';
  for(var mi=0;mi<MEAS.length;mi+=2){mh+='<div class="f-g2">';var ma=MEAS[mi],mb=MEAS[mi+1];mh+='<div class="f-wrap"><div class="f-lbl">'+ma.name+' cm</div><input class="f-in" id="ci_'+ma.id+'" placeholder="--" inputmode="decimal"></div>';if(mb)mh+='<div class="f-wrap"><div class="f-lbl">'+mb.name+' cm</div><input class="f-in" id="ci_'+mb.id+'" placeholder="--" inputmode="decimal"></div>';mh+='</div>';}
  mh+='<div class="mactions"><button class="btn" onclick="saveCheckin()">SPEICHERN</button><button class="btn btn-cancel" onclick="closeModal()">ABBRUCH</button></div>';
  openModal(mh);
}

function saveCheckin(){
  var f={};
  ['weight','visceral','muscle','fat','bp','sleep','sleepScore','note'].forEach(function(k){var el=document.getElementById('ci_'+k);f[k]=el?el.value.trim():'';});
  MEAS.forEach(function(m){var el=document.getElementById('ci_'+m.id);f[m.id]=el?el.value.trim():'';});
  var result=validateCheckinInline(f);
  if(!result.valid){applyCheckinErrors(result.errors);return;}
  processCheckin(f);closeModal();toast('Check-in gespeichert');render();
}

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
</body>
</html>
