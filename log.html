<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WASTELAND PANZER">
<title>LOG — WASTELAND PANZER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<style>/* injected */</style>
</head>
<body>
<div id="root"></div>
<script src="themes.js"></script>
<script src="core.js"></script>
<script>

// ---- LOG PAGE ----

function render() {
  const root = document.getElementById('root');
  let h = renderHeader('log.html');
  h += '<div class="scroll"><div class="pad">';
  h += '<div class="sec-title" style="border-top:none;margin-top:0">SYSTEM LOG</div>';

  if (!state.events.length) {
    h += '<div style="color:var(--gdim);font-size:9px">// Leer</div>';
  } else {
    state.events.slice().reverse().forEach(e => {
      h += `<div class="log-entry ${e.type}"><span class="log-date">[${e.date}]</span>${e.msg}</div>`;
    });
  }

  h += '<div class="page-footer">V5.4 · ' + new Date(document.lastModified).toLocaleDateString('de-DE') + ' ' + new Date(document.lastModified).toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'}) + '</div>';
  h += '</div></div>';
  root.innerHTML = h;
}

render();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
