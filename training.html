<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WASTELAND PANZER">
<title>TRAINING — WASTELAND PANZER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<style>/* injected */</style>
</head>
<body>
<div id="root"></div>
<script src="themes.js"></script>
<script src="core.js"></script>
<script>
// ---- TRAINING PAGE v3.2 ----
var modal = null;
var exSetsState = {};

function render() {
  var root = document.getElementById('root');
  var gLvl = getLvlInfo(state.globalXP);
  var gPct = Math.round((gLvl.currentXP/gLvl.neededXP)*100);
  var penSt = checkPenalty();

  var h = renderHeader('training.html');
  if (penSt.active) h += '<div class="penalty-bar">PANZER ROSTET — ' + penSt.days + ' TAGE INAKTIV</div>';
  h += '<div class="scroll"><div class="pad">';

  // GLOBAL LEVEL
  h += '<div class="card card-amber"><div class="card-title amber">GLOBAL LEVEL</div>';
  h += '<div class="big-num amber">' + gLvl.level + '</div>';
  h += '<div style="font-size:9px;color:var(--gdim);margin-top:2px">' + gLvl.currentXP + ' / ' + gLvl.neededXP + ' XP · Veteran x' + VET.toFixed(2) + '</div>';
  h += '<div style="height:5px;background:var(--g1);border:1px solid #332200;margin-top:5px;overflow:hidden"><div style="height:100%;width:' + gPct + '%;background:linear-gradient(90deg,var(--amber),#ffcc44)"></div></div></div>';

  // EGYM
  var egymS = state.trainings.filter(function(t){return t.type==='egym';});
  var lEgym = egymS.length>0 ? egymS[egymS.length-1] : null;
  h += '<div class="card"><div class="card-title">EGYM · LETZTER SCORE</div>';
  if (lEgym) {
    var prevE = egymS.length>1 ? egymS[egymS.length-2] : null;
    var ediff = prevE ? lEgym.score - prevE.score : null;
    h += '<div class="big-num">' + lEgym.score + '</div>';
    if (ediff!==null) h += '<div style="font-size:9px;color:' + (ediff>=0?'var(--glow)':'var(--red)') + '">' + (ediff>=0?'+':'') + Math.round(ediff) + ' vs. Vorherige</div>';
    h += '<div style="font-size:8px;color:var(--gdim);margin-top:2px">' + lEgym.date + ' · ' + lEgym.modeId + ' · ' + lEgym.sessionXP + ' XP</div>';
    if (lEgym.exData) {
      h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1px 8px;margin-top:6px;font-size:8px">';
      EGYM_EX.forEach(function(ex) {
        var sets = lEgym.exData[ex.id]||[];
        if (sets.length) h += '<div style="color:var(--gdim)">' + ex.name + '</div><div style="color:var(--text)">' + sets.map(function(s,i){return 'S'+(i+1)+':'+s.kg+'x'+s.wdh;}).join(' ') + '</div>';
      });
      h += '</div>';
    }
  } else h += '<div style="color:var(--gdim);font-size:9px">Noch keine Session.</div>';
  h += '</div>';

  // SEIL
  var seilS = state.trainings.filter(function(t){return t.type==='seil';});
  var lSeil = seilS.length>0 ? seilS[seilS.length-1] : null;
  h += '<div class="card card-blue"><div class="card-title blue">SEIL · LETZTE SESSION</div>';
  if (lSeil) {
    h += '<div class="big-num blue">' + (lSeil.rpm||'?') + ' RPM</div>';
    h += '<div style="font-size:9px;color:var(--gdim);margin-top:2px">' + formatMinSek(lSeil.dauer||0) + 'min · ' + (lSeil.runden||'?') + ' Runden · ' + lSeil.sessionXP + ' XP · ' + lSeil.date + '</div>';
  } else h += '<div style="color:var(--gdim);font-size:9px">Noch keine Session.</div>';
  h += '</div>';

  // RAD
  var bikeS = state.trainings.filter(function(t){return t.type==='bike';});
  var lBike = bikeS.length>0 ? bikeS[bikeS.length-1] : null;
  h += '<div class="card card-cyan"><div class="card-title cyan">RAD · LETZTE SESSION</div>';
  if (lBike) {
    h += '<div class="big-num" style="color:var(--cyan)">' + (lBike.distanz||'?') + ' km</div>';
    h += '<div style="font-size:9px;color:var(--gdim);margin-top:2px">' + formatMinSek(lBike.dauer||0) + 'min · ' + (lBike.avgSpeed||'?') + 'km/h Ø · ' + (lBike.maxSpeed?'Max '+lBike.maxSpeed+'km/h':'') + '</div>';
    h += '<div style="font-size:8px;color:var(--gdim)">' + lBike.sessionXP + ' XP · ' + lBike.date + '</div>';
  } else h += '<div style="color:var(--gdim);font-size:9px">Noch keine Session.</div>';
  h += '</div>';

  // ERGO
  var ergoS = state.trainings.filter(function(t){return t.type==='ergo';});
  var lErgo = ergoS.length>0 ? ergoS[ergoS.length-1] : null;
  h += '<div class="card" style="border-color:#336633"><div class="card-title" style="color:#66cc66">ERGOMETER · LETZTE SESSION</div>';
  if (lErgo) {
    h += '<div class="big-num" style="color:#66cc66">' + formatMinSek(lErgo.dauer||0) + ' min</div>';
    h += '<div style="font-size:9px;color:var(--gdim);margin-top:2px">' + (lErgo.distanz?lErgo.distanz+'km · ':'') + (lErgo.avgSpeed?lErgo.avgSpeed+'km/h Ø · ':'') + lErgo.sessionXP + ' XP · ' + lErgo.date + '</div>';
  } else h += '<div style="color:var(--gdim);font-size:9px">Noch keine Session.</div>';
  h += '</div>';

  h += '<button class="btn" onclick="openModal(\'egym\')">EGYM SESSION</button>';
  h += '<button class="btn blue" onclick="openModal(\'seil\')">SEIL SESSION</button>';
  h += '<button class="btn cyan" onclick="openModal(\'bike\')">RAD SESSION</button>';
  h += '<button class="btn" style="border-color:#336633;color:#66cc66" onclick="openModal(\'ergo\')">ERGOMETER SESSION</button>';
  h += '<div class="page-footer">V5.6 · ' + new Date(document.lastModified).toLocaleDateString('de-DE') + ' ' + new Date(document.lastModified).toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'}) + '</div>';
  h += '</div></div>';
  root.innerHTML = h;
  if (modal) renderModal();
}

function openModal(m) {
  modal = m;
  if (m==='egym') {
    exSetsState = {};
    EGYM_EX.forEach(function(ex){ exSetsState[ex.id] = [{kg:'',wdh:''},{kg:'',wdh:''},{kg:'',wdh:''}]; });
  }
  render();
  renderModal();
}

function closeModal() { modal=null; var m=document.getElementById('pp-modal'); if(m) m.remove(); }

function renderModal() {
  var old = document.getElementById('pp-modal');
  if(old) old.remove();
  if (!modal) return;
  var h = '<div class="modal-overlay" id="pp-modal"><div class="modal">';

  if (modal==='egym') {
    h += '<div class="modal-title">EGYM SESSION</div><div class="modal-sub">KG + WDH PRO SATZ · MODUS = XP-FAKTOR</div>';
    h += '<div class="f-wrap"><div class="f-lbl">TRAININGS-MODUS</div><select class="f-in" id="egym_mode" onchange="updateEgymPreview()">';
    EGYM_MODES.forEach(function(m){ h += '<option value="' + m.id + '"' + (m.id==='isokinetisch'?' selected':'') + '>' + m.name + ' (x' + m.factor + ')</option>'; });
    h += '</select></div>';
    EGYM_EX.forEach(function(ex) {
      var sets = exSetsState[ex.id]||[];
      h += '<div class="ex-section"><div class="ex-name">' + ex.name + ' <span style="font-size:7px;color:var(--gdim)">[' + ex.stat + ']</span></div><div class="ex-sets" id="sets_' + ex.id + '">';
      sets.forEach(function(set,i) {
        h += '<div class="ex-set-row"><div class="ex-set-num">S' + (i+1) + '</div>';
        h += '<input class="f-in" placeholder="kg" inputmode="decimal" style="text-align:center" value="' + (set.kg||'') + '" oninput="updateSet(\'' + ex.id + '\',' + i + ',\'kg\',this.value);updateEgymPreview()">';
        h += '<input class="f-in" placeholder="Wdh" inputmode="decimal" style="text-align:center" value="' + (set.wdh||'') + '" oninput="updateSet(\'' + ex.id + '\',' + i + ',\'wdh\',this.value);updateEgymPreview()">';
        h += '<div class="ex-set-del" onclick="removeSet(\'' + ex.id + '\',' + i + ')">x</div></div>';
      });
      h += '</div><button class="add-set-btn" onclick="addSet(\'' + ex.id + '\')">+ Satz</button></div>';
    });
    h += '<div class="score-prev"><div class="score-prev-val" id="sp_score">0</div><div class="score-prev-xp" id="sp_xp">0.0 XP</div><div class="score-prev-lbl">RAW SCORE · SESSION XP</div></div>';
    h += '<div class="mactions"><button class="btn" onclick="saveEgym()">SPEICHERN</button><button class="btn red" onclick="closeModal()">ABBRUCH</button></div>';
  }

  if (modal==='seil') {
    h += '<div class="modal-title">SEIL SESSION</div><div class="modal-sub">RPM WIRD AUTOMATISCH BERECHNET</div>';
    h += '<div class="f-g2">';
    h += '<div class="f-wrap"><div class="f-lbl">Dauer (min:sek)</div><input class="f-in" id="seil_dauer" placeholder="15:00" inputmode="text" oninput="updateRpmPreview()"></div>';
    h += '<div class="f-wrap"><div class="f-lbl">Gesamtsprünge</div><input class="f-in" id="seil_jumps" placeholder="800" inputmode="decimal" oninput="updateRpmPreview()"></div>';
    h += '</div>';
    h += '<div class="f-wrap"><div class="f-lbl">Runden</div><input class="f-in" id="seil_runden" placeholder="8" inputmode="decimal"></div>';
    h += '<div style="background:var(--g0);border:1px solid var(--gdim);padding:8px;text-align:center;margin:6px 0"><div style="font-family:var(--fontd);font-size:20px;color:var(--blue)" id="rpm_preview">-- RPM</div><div style="font-size:7px;color:var(--gdim)">Gesamtsprünge / Gesamtminuten</div></div>';
    h += '<div class="mactions"><button class="btn blue" onclick="saveSeil()">SPEICHERN</button><button class="btn red" onclick="closeModal()">ABBRUCH</button></div>';
  }

  if (modal==='bike') {
    h += '<div class="modal-title">RAD SESSION</div><div class="modal-sub">AVG SPEED WIRD AUTOMATISCH BERECHNET</div>';
    h += '<div class="f-g2">';
    h += '<div class="f-wrap"><div class="f-lbl">Distanz (km)</div><input class="f-in" id="bike_distanz" placeholder="1.58" inputmode="decimal" oninput="updateBikePreview()"></div>';
    h += '<div class="f-wrap"><div class="f-lbl">Dauer (min:sek)</div><input class="f-in" id="bike_dauer" placeholder="10:00" inputmode="text" oninput="updateBikePreview()"></div>';
    h += '</div>';
    h += '<div class="f-wrap"><div class="f-lbl">Max Peak Speed (km/h) — optional</div><input class="f-in" id="bike_maxspeed" placeholder="21.5" inputmode="decimal"></div>';
    h += '<div style="background:var(--g0);border:1px solid var(--gdim);padding:8px;text-align:center;margin:6px 0"><div style="font-family:var(--fontd);font-size:20px;color:var(--cyan)" id="bike_speed_preview">-- km/h Ø</div><div style="font-size:7px;color:var(--gdim)">Distanz / (Dauer in Stunden)</div></div>';
    h += '<div class="mactions"><button class="btn cyan" onclick="saveBike()">SPEICHERN</button><button class="btn red" onclick="closeModal()">ABBRUCH</button></div>';
  }

  if (modal==='ergo') {
    h += '<div class="modal-title">ERGOMETER SESSION</div><div class="modal-sub">AVG SPEED WIRD AUTOMATISCH BERECHNET</div>';
    h += '<div class="f-g2">';
    h += '<div class="f-wrap"><div class="f-lbl">Distanz (km)</div><input class="f-in" id="ergo_distanz" placeholder="5.0" inputmode="decimal" oninput="updateErgoPreview()"></div>';
    h += '<div class="f-wrap"><div class="f-lbl">Dauer (min:sek)</div><input class="f-in" id="ergo_dauer" placeholder="15:00" inputmode="text" oninput="updateErgoPreview()"></div>';
    h += '</div>';
    h += '<div style="background:var(--g0);border:1px solid var(--gdim);padding:8px;text-align:center;margin:6px 0"><div style="font-family:var(--fontd);font-size:20px;color:#66cc66" id="ergo_speed_preview">-- km/h Ø</div><div style="font-size:7px;color:var(--gdim)">Distanz / (Dauer in Stunden)</div></div>';
    h += '<div class="mactions"><button class="btn" style="border-color:#336633;color:#66cc66" onclick="saveErgo()">SPEICHERN</button><button class="btn red" onclick="closeModal()">ABBRUCH</button></div>';
  }

  h += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
  updateEgymPreview();
}

function updateSet(exId, idx, field, val) { if(exSetsState[exId]) exSetsState[exId][idx][field]=val; }
function addSet(exId) { if(!exSetsState[exId]) exSetsState[exId]=[]; exSetsState[exId].push({kg:'',wdh:''}); renderModal(); }
function removeSet(exId, idx) { if(exSetsState[exId]) exSetsState[exId].splice(idx,1); renderModal(); }

function updateEgymPreview() {
  var modeId = (document.getElementById('egym_mode')||{}).value||'isokinetisch';
  var modeObj = EGYM_MODES.find(function(m){return m.id===modeId;})||EGYM_MODES[3];
  var lastCI = (state.checkins&&state.checkins.length) ? state.checkins.findLast(function(c){return c&&c.weight;}) : null;
  var bw = lastCI ? parseFloat(lastCI.weight) : 107.4;
  var sets = [], score = 0;
  EGYM_EX.forEach(function(ex) {
    (exSetsState[ex.id]||[]).forEach(function(s) {
      var kg=parseFloat(s.kg||0), wdh=parseFloat(s.wdh||0);
      if(kg>0&&wdh>0){ score+=kg*wdh; sets.push({kg:kg,wdh:wdh,stat:ex.stat}); }
    });
  });
  var xpR = calcEgymXP(sets, bw, modeObj.factor);
  var sp=document.getElementById('sp_score'), sx=document.getElementById('sp_xp');
  if(sp) sp.textContent=Math.round(score);
  if(sx) sx.textContent=xpR.total.toFixed(1)+' XP';
}

function updateRpmPreview() {
  var j=parseInt((document.getElementById('seil_jumps')||{}).value||0,10);
  var dur=parseMinSek((document.getElementById('seil_dauer')||{}).value||'');
  var el=document.getElementById('rpm_preview');
  if(el) el.textContent = (dur>0&&j>0) ? Math.round(j/dur)+' RPM' : '-- RPM';
}

function updateBikePreview() {
  var d=parseFloat((document.getElementById('bike_distanz')||{}).value||0);
  var dur=parseMinSek((document.getElementById('bike_dauer')||{}).value||'');
  var el=document.getElementById('bike_speed_preview');
  if(el) el.textContent = (dur>0&&d>0) ? (Math.round((d/(dur/60))*10)/10)+' km/h Ø' : '-- km/h Ø';
}

function updateErgoPreview() {
  var d=parseFloat((document.getElementById('ergo_distanz')||{}).value||0);
  var dur=parseMinSek((document.getElementById('ergo_dauer')||{}).value||'');
  var el=document.getElementById('ergo_speed_preview');
  if(el) el.textContent = (dur>0&&d>0) ? (Math.round((d/(dur/60))*10)/10)+' km/h Ø' : '-- km/h Ø';
}

function saveEgym() {
  var modeId=(document.getElementById('egym_mode')||{}).value||'isokinetisch';
  var exData={};
  EGYM_EX.forEach(function(ex){ exData[ex.id]=(exSetsState[ex.id]||[]).filter(function(s){return parseFloat(s.kg)>0&&parseFloat(s.wdh)>0;}); });
  processEgym(exData, modeId);
  closeModal(); toast('EGYM gespeichert'); render();
}

function saveSeil() {
  var dauer=(document.getElementById('seil_dauer')||{}).value||'';
  var runden=(document.getElementById('seil_runden')||{}).value||'';
  var jumps=(document.getElementById('seil_jumps')||{}).value||'';
  if (!dauer||!jumps) { toast('Dauer + Gesamtsprünge erforderlich','err'); return; }
  processSeil({dauer:dauer, runden:runden, jumps:jumps, seconds:null});
  closeModal(); toast('Seil gespeichert'); render();
}

function saveBike() {
  var distanz=(document.getElementById('bike_distanz')||{}).value||'';
  var dauer=(document.getElementById('bike_dauer')||{}).value||'';
  var maxSpeed=(document.getElementById('bike_maxspeed')||{}).value||'';
  if (!distanz||!dauer) { toast('Distanz + Dauer erforderlich','err'); return; }
  var dauerMin = parseMinSek(dauer);
  var avgSpeedCalc = dauerMin > 0 ? Math.round((parseFloat(distanz)/(dauerMin/60))*10)/10 : 0;
  processBike({distanz:distanz, dauer:dauer, maxSpeed:maxSpeed, avgSpeed:avgSpeedCalc});
  closeModal(); toast('Rad gespeichert'); render();
}

function saveErgo() {
  var distanz=(document.getElementById('ergo_distanz')||{}).value||'';
  var dauer=(document.getElementById('ergo_dauer')||{}).value||'';
  if (!dauer) { toast('Dauer erforderlich','err'); return; }
  processErgo({distanz:distanz, dauer:dauer});
  closeModal(); toast('Ergometer gespeichert'); render();
}

render();


</script>
</body>
</html>
